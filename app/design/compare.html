<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Пять вариантов дизайна</title><link rel="stylesheet" href="fonts.css"><style>*{box-sizing:border-box}body{margin:0;background:#F3F2EE;color:#263135;font:14px Manrope,Arial,sans-serif}.wrap{max-width:1180px;padding:30px;margin:auto}h1{font-size:30px;font-weight:550;letter-spacing:-.04em;margin:0 0 8px}p{color:#576261;font-size:13px;margin:0 0 24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.tile{min-width:0;border:1px solid #D0D5CF;border-radius:14px;overflow:hidden;background:#FFF}.tile header{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;gap:10px}h2{font-size:14px;font-weight:600;margin:0}.swatches{display:flex;gap:3px}.swatches i{width:14px;height:14px;border-radius:50%}.window{height:380px;overflow:hidden}.window iframe{width:1440px;height:1000px;border:0;transform:scale(.38);transform-origin:top left;pointer-events:none}.note{padding:26px;background:#E5E7DF;border-radius:14px;display:flex;flex-direction:column;justify-content:center}.note h2{font-size:24px;line-height:1.5;max-width:300px}.note p{font-size:14px;line-height:1.7;margin:18px 0 0;max-width:340px}.footer{margin-top:22px;font-size:12px;color:#576261}</style></head><body><main class="wrap"><h1>Пять цветовых направлений</h1><p>Restaurant Platform · экран официанта · дизайн-макеты с тестовыми данными</p><div class="grid" id="grid"></div><div class="footer">В интерактивном сравнении доступны также кухня и бар, кабинет владельца, администратор и мобильный вид.</div></main><script src="themes.js?v=20261106-flow"></script><script>document.getElementById('grid').innerHTML=THEMES.map(t=>`<article class="tile"><header><h2>${t.letter}. ${t.name}</h2><div class="swatches">${t.colors.map(c=>`<i style="background:${c}"></i>`).join('')}</div></header><div class="window"><iframe title="${t.name}" src="screen.html?theme=${t.id}&role=waiter"></iframe></div></article>`).join('')+'<aside class="note"><h2>Сравните не только цвет, но и ощущение от работы.</h2><p>А — глубокий и камерный.<br>Б — чёткий и универсальный.<br>В — выразительный вечерний.<br>Г — мягкий и спокойный.<br>Д — тёплый прибрежный.</p></aside>';</script></body></html>
