<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Chez Oanh Order Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap">
<style>
/* Layout: staff app in two skins chosen by the user (body[data-skin]).
   Dark = onyx black with warm gold and silver hairlines. Light = ivory / crème brûlée with espresso ink and caramel accents.
   Top bar = brand + role switch + tools; panes hold Guest / Waiter / Kitchen / Owner. */
:root{
  --f:"Montserrat",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --fd:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif;
  --r:20px; --r2:14px;
  /* dark skin (default) */
  --bg:#1b1b1e; --bg2:#222225; --card:#29292d; --card2:#303035; --glass:rgba(27,27,30,.78);
  --line:rgba(255,255,255,.06); --line2:rgba(255,255,255,.13); --silver:#b8bbc1;
  --ink:#ecebe8; --muted:#a4a19b; --dim:#6f6d69;
  --acc:#e77a43; --acc2:#f4a774; --acc-ink:#1c0f07; --grad:linear-gradient(135deg,#f7ad78 0%,#e77a43 48%,#b9512a 100%);
  --hot:#ff8a4c; --hot-glow:rgba(255,128,64,.55);
  --new:#ecebe8; --cook:#8fa6bd; --ready:#ff8a4c; --late:#ff5a48; --acc-st:#e3ab5c; --served:#6f6d69;
  /* palette from the graphite/copper reference: copper, sunset peach, brass, steel blue, silver, dusk rose */
  --c1:#e77a43; --c2:#8fa6bd; --c3:#d9a65a; --c4:#c08f86; --c5:#c4c7cc; --c6:#f2b28c;
  /* 8 clearly different table colours (copper, steel blue, brass, teal, dusk rose, plum, sage, peach) */
  --t1:#e77a43; --t2:#6f97c9; --t3:#d9a94f; --t4:#4fa59f; --t5:#d07a8a; --t6:#9a80c4; --t7:#8fae7f; --t8:#f2b28c;
  --paper:#26262a; --paper2:#2f2f34; --paper-ink:#ecebe8; --paper-dim:#8f8c86; --paper-line:rgba(255,255,255,.07);
  --shadow:0 18px 40px -18px rgba(0,0,0,.75),0 1px 0 rgba(255,255,255,.045) inset;
  --glow:radial-gradient(1100px 520px at 88% -12%,rgba(231,122,67,.10),transparent 60%),radial-gradient(900px 520px at -10% 110%,rgba(184,187,193,.05),transparent 60%);
  color-scheme:dark;
}
body[data-skin="light"]{
  /* Japandi: warm ivory, stone beige, warm taupe, sage, natural wood, terracotta, deep brown, soft charcoal */
  --bg:#ede6db; --bg2:#e5dccf; --card:#f6f1e9; --card2:#e9e0d2; --glass:rgba(237,230,219,.82);
  --line:#d6ccbd; --line2:#afa091; --silver:#8a7d70;
  --ink:#2d2d2d; --muted:#5b4e43; --dim:#8b7e70;
  --acc:#b8683f; --acc2:#b88b60; --acc-ink:#fbf7f0; --grad:linear-gradient(135deg,#d39271 0%,#b8683f 50%,#8f4a2a 100%);
  --hot:#c0623a; --hot-glow:rgba(192,98,58,.38);
  --new:#4b3e33; --cook:#6f7d64; --ready:#c0623a; --late:#97362a; --acc-st:#a8794e; --served:#afa091;
  /* Japandi swatches: terracotta, olive, sage, natural wood, slate, soft terracotta */
  --c1:#b8683f; --c2:#7f8a74; --c3:#b88b60; --c4:#6f7774; --c5:#d39a7c; --c6:#6e7550;
  /* only swatches from the Japandi references: terracotta, olive, natural wood, slate, soft terracotta, forest linen, light sage, deep brown */
  --t1:#c06a45; --t2:#6e7350; --t3:#b88b60; --t4:#6f7774; --t5:#a39582; --t6:#4c5747; --t7:#a7ad86; --t8:#5a4637;
  --paper:#f8f4ec; --paper2:#ede5d8; --paper-ink:#2d2d2d; --paper-dim:#857868; --paper-line:#ddd3c4;
  --shadow:0 18px 40px -24px rgba(75,62,51,.35),0 1px 0 rgba(255,255,255,.7) inset;
  --glow:radial-gradient(1100px 520px at 90% -10%,rgba(127,138,116,.16),transparent 60%),radial-gradient(900px 520px at -10% 110%,rgba(184,139,96,.14),transparent 60%);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:#1b1b1e}
body{margin:0;background:var(--bg);background-image:var(--glow);background-attachment:fixed;color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;transition:background-color .35s,color .35s}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);border-bottom:1px solid var(--line)}
.top .in{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:12px 20px;max-width:1540px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.brand .mono{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--fd);font-weight:600;font-size:20px;font-style:italic;color:var(--acc-ink);background:var(--grad);box-shadow:0 0 0 1px var(--line2),0 6px 18px -6px var(--hot-glow)}
.brand .bt{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand b{font-family:var(--fd);font-size:23px;font-weight:600;letter-spacing:.01em}
.brand small{color:var(--dim);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;margin-top:3px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.seg button{border:0;background:transparent;border-radius:999px;padding:8px 15px;font-weight:600;font-size:12.5px;letter-spacing:.03em;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:7px;transition:color .2s,background .2s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--grad);color:var(--acc-ink);box-shadow:0 6px 18px -6px var(--hot-glow)}
.seg .cnt{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--late);color:#fff;font-size:10.5px;font-weight:700;display:inline-grid;place-items:center}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chipbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 13px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;transition:border-color .2s,color .2s}
.chipbtn:hover{border-color:var(--line2);color:var(--ink)}
.chipbtn.on{color:var(--acc);border-color:var(--acc)}
.skin{width:36px;height:36px;padding:0;display:grid;place-items:center;border:1px solid var(--line);background:var(--card);border-radius:999px;color:var(--acc);transition:border-color .2s,transform .3s}
.skin:hover{border-color:var(--acc)}
.skin:active{transform:rotate(-30deg)}
.skin svg{width:17px;height:17px}
.skin .sun,body[data-skin="light"] .skin .moon{display:none}
body[data-skin="light"] .skin .sun{display:block}
.demo{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:8px 20px 10px;max-width:1540px;margin:0 auto;font-size:12px;color:var(--dim)}
.demo button{border:1px dashed var(--line2);background:transparent;color:var(--acc);border-radius:999px;padding:6px 12px;font-weight:600;font-size:12px}
.demo button:hover{border-style:solid}
.demo button:disabled{opacity:.4;cursor:not-allowed}

/* panes */
.panes{display:grid;gap:20px;padding:22px 20px;max-width:1540px;margin:0 auto;padding-bottom:calc(48px + env(safe-area-inset-bottom,0px))}
.panes.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:900px){.panes.split{grid-template-columns:1fr}}
@media (max-width:520px){.top .in,.demo{padding-inline:14px}.panes{padding-inline:14px}}
.pane{min-width:0;background:linear-gradient(180deg,var(--bg2),color-mix(in srgb,var(--bg2) 92%,#000));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.pane>.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line)}
.pane>.ph b{font-family:var(--fd);font-size:22px;font-weight:600;letter-spacing:.01em;color:var(--ink);text-transform:none}
.pane>.ph b::after{content:"";display:inline-block;width:28px;height:1px;background:var(--acc);vertical-align:middle;margin-left:12px;opacity:.7}
.pane>.pb{padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.single .pane{max-width:940px;margin:0 auto;width:100%}
.single .pane.guest{max-width:440px}
.single .pane.owner{max-width:1180px}

h2{margin:0;font-family:var(--fd);font-size:30px;font-weight:600;line-height:1.05;text-wrap:balance}
h3{margin:0;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.btn{position:relative;overflow:hidden;isolation:isolate;border:0;border-radius:999px;padding:11px 18px;font-weight:700;font-size:13px;letter-spacing:.02em;background:var(--grad);color:var(--acc-ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 8px 22px -10px var(--hot-glow),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .15s,filter .15s,box-shadow .2s}
.btn::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%);pointer-events:none}
.btn:hover::after{animation:shine .9s ease}
.btn:hover{box-shadow:0 10px 28px -8px var(--hot-glow),inset 0 1px 0 rgba(255,255,255,.3)}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--ink);font-weight:600;box-shadow:none}
/* "ready" actions: hot copper, glowing + shimmering on their own */
.btn.green{background:linear-gradient(135deg,#ffc08f 0%,var(--hot) 45%,#c9461c 100%);color:#1c0b04;box-shadow:0 0 0 1px rgba(255,170,120,.35),0 8px 26px -6px var(--hot-glow)}
body[data-skin="light"] .btn.green{color:#fff}
@media (prefers-reduced-motion:no-preference){
 .btn.green{animation:glow 2.2s ease-in-out infinite}
 .btn.green::after{animation:shine 2.6s ease-in-out infinite}
 @keyframes glow{50%{box-shadow:0 0 0 1px rgba(255,170,120,.55),0 0 26px 2px var(--hot-glow)}}
}
@keyframes shine{0%{transform:translateX(-120%)}60%,100%{transform:translateX(120%)}}
.btn.blue{background:var(--card2);color:var(--ink);border:1px solid var(--line2);box-shadow:none}
.btn.sm{padding:8px 14px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;letter-spacing:.05em;white-space:nowrap;border:1px solid currentColor}
.st-new{color:var(--new)}
.st-accepted{color:var(--acc2)}
.st-cooking{color:var(--cook)}
.st-ready{color:var(--ready);box-shadow:0 0 12px -3px var(--hot-glow)}
.pill.st-new{background:color-mix(in srgb,var(--new) 8%,transparent)}
.st-served{color:var(--dim)}
.st-late{color:var(--late)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--card2);color:var(--ink);border-color:var(--acc);box-shadow:inset 0 -2px 0 var(--acc)}
.empty{padding:34px 10px;text-align:center;color:var(--dim);border:1px dashed var(--line2);border-radius:var(--r2);font-family:var(--fd);font-style:italic;font-size:19px}

/* order cards */
.oc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:14px 16px 14px 20px;display:flex;flex-direction:column;gap:10px;min-width:0;overflow:hidden}
.oc::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--line2)}
.oc.s-new::before{background:var(--new)}.oc.s-accepted::before{background:var(--acc2)}.oc.s-cooking::before{background:var(--cook)}.oc.s-ready::before{background:var(--grad);box-shadow:0 0 12px var(--hot-glow)}
.oc.s-ready{border-color:color-mix(in srgb,var(--hot) 40%,var(--line))}
.oc.s-served{opacity:.7}
.oc.late{border-color:var(--late)}
@media (prefers-reduced-motion:no-preference){.oc.late{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 3px color-mix(in srgb,var(--late) 25%,transparent)}}}
.oh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.oh .tb{font-family:var(--fd);font-size:30px;font-weight:600;line-height:1;letter-spacing:-.01em}
.oh .no{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.oh .tm{margin-left:auto;font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)}
.meta{font-size:12px;color:var(--dim)}
.lines{list-style:none;margin:0;padding:10px 0 0;display:flex;flex-direction:column;gap:7px;border-top:1px solid var(--line)}
.lines li{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:start}
.lines .q{font-family:var(--fd);font-weight:700;font-size:20px;line-height:1.1;color:var(--acc);font-variant-numeric:tabular-nums}
.lines .n{min-width:0}
.lines .n b{font-weight:600}
.lines .n .tr{display:block;font-size:11.5px;color:var(--dim)}
.lines .n .note{display:inline-block;margin-top:4px;font-size:11.5px;color:var(--acc);border:1px solid var(--line2);border-radius:999px;padding:1px 8px}
.lines .p{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;white-space:nowrap}
.cmt{font-size:13px;font-style:italic;background:var(--card2);border-left:2px solid var(--acc);border-radius:0 10px 10px 0;padding:8px 12px}
.wish{display:flex;flex-wrap:wrap;gap:5px}
.wish span{font-size:11px;font-weight:600;border-radius:999px;padding:2px 9px;color:var(--late);border:1px solid color-mix(in srgb,var(--late) 50%,transparent)}
.of{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:2px}
.of .tot{margin-right:auto;font-family:var(--fd);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.badge-new{font-size:10px;font-weight:800;color:var(--acc-ink);background:var(--grad);border-radius:999px;padding:1px 6px;margin-left:5px;vertical-align:1px}
.steps{display:flex;gap:4px;align-items:center}
.steps i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--grad)}

/* waiter */
.who{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px;flex-wrap:wrap}
.who select{background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:8px 12px}
.shift{border:0;border-radius:999px;padding:9px 15px;font-weight:700;font-size:12.5px}
.shift.on{background:transparent;color:var(--hot);border:1px solid var(--hot);box-shadow:0 0 16px -4px var(--hot-glow),inset 0 0 10px -4px var(--hot-glow)}
.shift.off{background:transparent;color:var(--muted);border:1px solid var(--line2)}
.alert{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:linear-gradient(90deg,color-mix(in srgb,var(--hot) 16%,transparent),transparent);border:1px solid color-mix(in srgb,var(--hot) 55%,transparent);box-shadow:0 0 22px -10px var(--hot-glow);border-radius:var(--r2);padding:10px 14px;font-weight:600}
.alert.red{background:color-mix(in srgb,var(--late) 10%,transparent);border-color:color-mix(in srgb,var(--late) 50%,transparent)}
.alert .sp{flex:1}

/* kitchen tickets */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.kc{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0;box-shadow:var(--shadow)}
.kc .kh{display:flex;align-items:baseline;gap:8px;padding:12px 14px;border-bottom:1px dashed var(--paper-line);background:linear-gradient(90deg,color-mix(in srgb,var(--cook) 18%,transparent),transparent)}
.kc.ready .kh{background:linear-gradient(90deg,color-mix(in srgb,var(--hot) 26%,transparent),transparent)}
.kc.ready{border-color:color-mix(in srgb,var(--hot) 45%,var(--paper-line));box-shadow:0 0 26px -12px var(--hot-glow),var(--shadow)}
.kc.slow .kh{background:linear-gradient(90deg,color-mix(in srgb,var(--late) 26%,transparent),transparent)}
.kc .kh .tb{font-family:var(--fd);font-size:28px;font-weight:700;line-height:1}
.kc .kh .tm{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;color:var(--cook)}
.kc.slow .kh .tm{color:var(--late)}
.kc.ready .kh .tm{color:var(--ready)}
.kc .kb{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.kc .ki{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start;border:0;background:transparent;text-align:left;padding:5px 0;color:inherit;border-bottom:1px solid var(--paper-line)}
.kc .ki:last-of-type{border-bottom:0}
.kc .ki .q{font-family:var(--fd);font-size:22px;font-weight:700;line-height:1;color:var(--acc)}
.kc .ki b{font-size:15px;font-weight:600;line-height:1.3}
.kc .ki .note{display:block;font-size:12.5px;font-weight:700;color:var(--late);margin-top:2px}
.kc .ki .sub{display:block;font-size:11.5px;color:var(--paper-dim)}
.kc .ki.done b,.kc .ki.done .q{text-decoration:line-through;opacity:.4}
.kc .ki .stn{font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--paper-dim);margin-left:6px;border:1px solid var(--paper-line);border-radius:999px;padding:0 6px;vertical-align:2px}
.kc .kcm{font-size:13px;font-style:italic;background:var(--paper2);border-left:2px solid var(--acc);border-radius:0 8px 8px 0;padding:7px 10px}
.kc .kw{font-size:12px;font-weight:700;color:var(--late)}
.kc .kf{padding:10px 14px;border-top:1px solid var(--paper-line);display:flex;gap:8px;align-items:center}
.kc .kf .meta{color:var(--paper-dim)}

/* guest phone */
.phone{background:var(--bg);border-radius:30px;border:1px solid var(--line2);overflow:hidden;box-shadow:var(--shadow)}
.gh{padding:16px;background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 22%,var(--card)),var(--card));display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.gh b{font-family:var(--fd);font-size:24px;font-weight:600}
.gh small{display:block;color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.gl{display:flex;gap:3px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:3px}
.gl button{border:0;background:transparent;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700;color:var(--muted)}
.gl button.on{background:var(--grad);color:var(--acc-ink)}
.gm{padding:6px 14px 12px;display:flex;flex-direction:column;max-height:560px;overflow:auto}
.gi{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.gi img{width:60px;height:60px;border-radius:14px;object-fit:cover;background:var(--card)}
.gi .nm{font-weight:600;font-size:13.5px;line-height:1.25}
.gi .pr{color:var(--acc);font-family:var(--fd);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.qa{display:flex;align-items:center;gap:5px}
.qa button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line2);background:transparent;color:var(--acc);font-weight:700;font-size:16px;line-height:1;transition:background .15s,color .15s}
.qa button:hover{background:var(--grad);color:var(--acc-ink);border-color:transparent}
.qa b{min-width:16px;text-align:center;font-variant-numeric:tabular-nums}
.gsec{font-family:var(--fd);font-style:italic;font-size:20px;color:var(--acc);padding:14px 0 2px}
.gbar{padding:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;background:var(--card)}
.gtrack{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;display:flex;flex-direction:column;gap:7px}
.gtrack .lab{font-size:12.5px;font-weight:700}

/* owner */

/* phone photo of a QR → small JPEG data URL (fits in storage, still scans) */
function readQr(file,cb){if(!file)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height));
  const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.9))};
  im.onerror=()=>toast(t("imgErr"),"","r");im.src=fr.result};fr.readAsDataURL(file)}

function beep(kind){if(!ST.sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const seq=kind==="ready"?[880,1175,1568]:kind==="kitchen"?[523,523]:[660,880];

/* who gets "ready" notifications */
function readyTargets(o){const on=WAITERS().filter(w=>ST.shift[w.id]).map(w=>w.id);
  if(ST.notify==="all")return on;
  if(ST.notify==="taker")return [o.waiter];
  return o.escalated?on:[o.waiter]}
function showsForMe(){return ST.role==="waiter"||ST.split}
/* events between old & new state (for toasts/sounds) */
function detectEvents(prev){
  if(prev&&prev.staff){const pp=new Set(prev.staff.filter(x=>x.status==="pending").map(x=>x.id));ST.staff.filter(x=>x.status==="pending"&&!pp.has(x.id)).forEach(x=>{if(ST.role==="owner"){toast(t("newReq")+": "+x.name,x.phone,"b");beep("new")}})}
  for(const b of Object.values(ST.bills)){if(b.closed||!b.req)continue;const pb=prev&&prev.bills&&prev.bills[b.id];if(pb&&pb.req&&pb.req.at===b.req.at)continue;
    const w=[...billOrders(b.id)].reverse().find(o=>o.waiter)?.waiter;
    if(ST.shift[ST.me]&&showsForMe()&&(!w||w===ST.me||!ST.shift[w])){toast(t("billReq")+" · "+t("table")+" "+b.table,reqTxt(b.req)+" · "+vnd(billTotal(b.id)),"r");beep("ready")}}
  const pm=Object.fromEntries((prev?prev.orders:[]).map(o=>[o.id,o]));
  for(const o of live()){const p=pm[o.id];
    if(!p&&o.status==="new"&&ST.shift[ST.me]&&showsForMe()&&forMe(o)){toast((o.round>1?t("addMore"):t("newAlert"))+" · "+t("table")+" "+o.table,o.items.length+" × · "+vnd(tot(o)));beep("new")}
    if(p&&!p.reEsc&&o.reEsc&&o.status==="new"&&o.owner!==ST.me&&ST.shift[ST.me]&&showsForMe()){toast(t("addMore")+" · "+t("table")+" "+o.table,t("reEscT").replace("{w}",wname(o.owner)),"r");beep("new")}
    if(p&&p.status!=="cooking"&&o.status==="cooking"&&(ST.role==="kitchen"||ST.split)){toast(t("kNew")+" · "+t("table")+" "+o.table,wname(o.waiter),"b");beep("kitchen")}
    if(p&&p.status!=="ready"&&o.status==="ready"&&readyTargets(o).includes(ST.me)&&showsForMe()){toast(t("readyAlert")+" · "+t("table")+" "+o.table,"#"+o.no+" · "+wname(o.waiter),"g");beep("ready")}
    if(p&&!p.escalated&&o.escalated&&o.status==="ready"&&ST.shift[ST.me]&&o.waiter!==ST.me&&showsForMe()&&ST.notify!=="taker"){toast(t("readyAll")+" · "+t("table")+" "+o.table,"#"+o.no+" · "+wname(o.waiter),"r");beep("ready")}
  }
}

/* ---------- actions ---------- */
function logE(k,who,extra){ST.log.unshift({at:Date.now(),k,who,by:"oanh",extra:extra||""});ST.log=ST.log.slice(0,40)}
function staffBy(id){return ST.staff.find(x=>x.id===id)}
function joinReq(name,phone,tipQr){mutate(()=>{const id="u"+Date.now().toString(36);ST.staff.push({id,name,phone,role:"waiter",status:"pending",createdAt:Date.now(),tipQr:tipQr||""});ST.device=id;logE("req",id)})}
function approve(id,role){mutate(()=>{const x=staffBy(id);if(!x)return;x.role=role||x.role;x.status="active";x.approvedAt=Date.now();logE("ok",id,role)})}
function reject(id){mutate(()=>{const x=staffBy(id);if(!x)return;x.status="rejected";logE("no",id)})}
function block(id){mutate(()=>{const x=staffBy(id);if(!x)return;x.status=x.status==="blocked"?"active":"blocked";if(x.status==="blocked")ST.shift[id]=false;logE(x.status==="blocked"?"block":"unblock",id)})}
function removeS(id){mutate(()=>{const x=staffBy(id);if(!x)return;x.status="deleted";ST.shift[id]=false;if(ST.device===id)ST.device=null;logE("del",id)})}
function setRole(id,r){mutate(()=>{const x=staffBy(id);if(!x)return;x.role=r;logE("role",id,r)})}
function reissue(){mutate(()=>{const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let k="CO-";for(let i=0;i<4;i++)k+=c[Math.floor(Math.random()*c.length)];ST.joinCode=k;logE("code","",k)})}
function reqTxt(r){return t("pay_"+r.pay)+(r.check?" · "+t("check")+" "+r.check:"")+(r.paid?" · "+t("paidQr"):"")}
function openBill(table){return Object.values(ST.bills).find(b=>!b.closed&&b.table===table)}
function newOrder(o){ST.seq++;let b=openBill(o.table);if(!b){b={id:"b"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),table:o.table,openedAt:Date.now(),closed:false};ST.bills[b.id]=b}o.bill=b.id;o.round=ST.orders.filter(x=>x.bill===b.id).length+1;if(o.round>1&&!o.waiter){const prevW=[...ST.orders.filter(x=>x.bill===b.id&&x.waiter)].pop();if(prevW)o.owner=prevW.waiter}o.id="o"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);o.no=ST.seq;o.createdAt=Date.now();o.status=o.status||"new";o.escalated=false;ST.orders.push(o);return o}
function forMe(o){if(o.status!=="new"||!o.owner)return true;return o.owner===ST.me||!ST.shift[o.owner]||!!o.reEsc}
function accept(id){mutate(()=>{const o=ST.orders.find(x=>x.id===id);if(!o||o.status!=="new"||!forMe(o))return;o.status="accepted";o.waiter=ST.me;o.acceptedAt=Date.now();o.lateAccept=o.acceptedAt-o.createdAt>NEW_LATE_MS})}

function simulate(more){const langs=["en","ru","ru","ko","zh","en"];const l=langs[Math.floor(Math.random()*langs.length)];

/* tick: escalations + live timers */
setInterval(()=>{const now=Date.now();
  const due=live().filter(o=>o.status==="ready"&&!o.escalated&&ST.notify==="esc"&&now-o.readyAt>ESC_MS);
  if(due.length){mutate(()=>{due.forEach(d=>{const o=ST.orders.find(x=>x.id===d.id);if(o)o.escalated=true})});return}
  const due2=live().filter(o=>o.status==="new"&&o.owner&&!o.reEsc&&now-o.createdAt>REORDER_MS);
  if(due2.length){mutate(()=>{due2.forEach(d=>{const o=ST.orders.find(x=>x.id===d.id);if(o)o.reEsc=true})});return}
  document.querySelectorAll("[data-left]").forEach(el=>{const s=Math.max(0,Math.ceil((+el.dataset.left-now)/1000));el.textContent="0:"+String(s).padStart(2,"0")});
  document.querySelectorAll("[data-since]").forEach(el=>{el.textContent=since(+el.dataset.since)});
  document.querySelectorAll("[data-mmss]").forEach(el=>{el.textContent=mmss(+el.dataset.mmss)});
  document.querySelectorAll("[data-late]").forEach(el=>{const late=now-(+el.dataset.late)>NEW_LATE_MS;el.classList.toggle("late",late);const pl=el.querySelector(".latepill");if(pl)pl.hidden=!late});
  document.querySelectorAll("[data-slow]").forEach(el=>el.classList.toggle("slow",now-(+el.dataset.slow)>15*60e3));
},1000);

let stopQ="";

function setStop(k,on){mutate(()=>{ST.stop=ST.stop||{};if(on)ST.stop[k]={at:Date.now(),by:ST.role};else delete ST.stop[k]});toast(on?t("stopOk"):t("stopRet"),coDish(k),on?"r":"g")}
function coDish(k){const [sid,i]=k.split("|");const s=CO.find(x=>x[0]===sid);const d=s&&s[3][+i];return d?coName(d,ST.lang):k}
function rStop(el){const stop=ST.stop||{};const ks=Object.keys(stop).sort((a,b)=>stop[b].at-stop[a].at);const l=ST.lang;
  const row=(k,d,out)=>`<li class="${out?"out":""}" data-q="${esc((d[0]+" "+d[1]).toLowerCase())}"><div class="n"><b>${esc(coName(d,l))}</b>${l==="ru"?`<span>${esc(d[0])}</span>`:""}</div><button class="btn sm ${out?"":"outb"}" type="button" data-stop="${k}" data-on="${out?0:1}">${esc(out?t("stopBack"):t("stopOut"))}</button></li>`;
  el.innerHTML=`<div class="card"><h3>${esc(t("stopT"))} · ${ks.length}</h3><p class="muted" style="margin:0">${esc(t("stopH"))}</p>${ks.length?`<ul class="stopl">${ks.map(k=>{const [sid,i]=k.split("|");const s=CO.find(x=>x[0]===sid);const d=s&&s[3][+i];return d?row(k,d,true):""}).join("")}</ul>`:`<div class="empty" style="padding:14px">${esc(t("stopNone"))}</div>`}</div>
   <div class="card"><h3>${esc(t("stopAll"))}</h3><input class="stopin" id="stopQ" type="search" placeholder="${esc(t("stopQ"))}" value="${esc(stopQ)}"><ul class="stopl" id="stopAll">${CO.map(s=>`<h4 data-sec="${s[0]}">${esc(l==="ru"?s[2]:s[1])}</h4>`+s[3].map((d,i)=>row(s[0]+"|"+i,d,!!stop[s[0]+"|"+i])).join("")).join("")}</ul></div>`;
  const flt=()=>{const q=stopQ.trim().toLowerCase();const all=el.querySelector("#stopAll");let shown={};
    all.querySelectorAll("li").forEach(li=>{const v=!q||li.dataset.q.includes(q);li.hidden=!v;if(v)shown[li.querySelector("[data-stop]").dataset.stop.split("|")[0]]=1});
    all.querySelectorAll("h4").forEach(h=>h.hidden=!shown[h.dataset.sec])};
  const qi=el.querySelector("#stopQ");qi.oninput=()=>{stopQ=qi.value;flt()};flt();
  el.querySelectorAll("[data-stop]").forEach(b=>b.onclick=()=>setStop(b.dataset.stop,b.dataset.on==="1"))}
const ROLE_OPTS=["waiter","kitchen","manager"];

  el.innerHTML=`<div class="card"><h3>${esc(t("payQrT"))}</h3><div class="payqr">${ST.payQr?`<img class="qrimg" src="${ST.payQr}" alt="QR">`:`<div class="qrnone">${esc(t("payQrNo"))}</div>`}<div class="qrt"><p class="muted" style="margin:0">${esc(t("payQrH"))}</p><div class="row"><label class="btn sm upl">${esc(ST.payQr?t("repQr"):t("upQr"))}<input type="file" accept="image/*" id="payQrIn"></label>${ST.payQr?`<button class="btn ghost sm" type="button" id="payQrDel">${esc(t("delQr"))}</button>`:""}</div></div></div></div>
   <div class="card"><h3>${esc(t("revT"))}</h3><p class="muted" style="margin:0">${esc(t("revH"))}</p><div class="revf"><label>${esc(t("revG"))}<input id="revG" type="url" inputmode="url" placeholder="https://maps.app.goo.gl/…" value="${esc((ST.rev||{}).g||"")}"></label><label>${esc(t("revTa"))}<input id="revTa" type="url" inputmode="url" placeholder="https://www.tripadvisor.com/…" value="${esc((ST.rev||{}).ta||"")}"></label><div class="row"><button class="btn sm" type="button" id="revSave">${esc(t("revSave"))}</button></div></div></div>
   <div class="two">
    <div class="card"><h3>${esc(t("qrTitle"))}</h3><div class="qrbox"><div id="qrJoin" class="qr"></div><div class="qrt"><p class="muted" style="margin:0">${esc(t("qrHint"))}</p><div class="code">${esc(ST.joinCode)}</div><button class="btn ghost sm" type="button" id="reissue">${esc(t("reissue"))}</button></div></div></div>
    <div class="card"><h3>${esc(t("reqs"))} · ${pend.length}</h3>${pend.length?pend.map(x=>`<div class="req"><div class="rq1"><b>${esc(x.name)}</b><span class="dim">${esc(x.phone)} · ${ago(x.createdAt)} ${esc(t("ago"))}</span></div><div class="row"><select data-rrole="${x.id}" aria-label="role">${ROLE_OPTS.map(r=>`<option value="${r}">${esc(roleName(r))}</option>`).join("")}</select><span class="sp"></span><button class="btn ghost sm" type="button" data-rej="${x.id}">${esc(t("rejectB"))}</button><button class="btn sm" type="button" data-ok="${x.id}">${esc(t("approveB"))}</button></div></div>`).join(""):`<div class="empty" style="padding:18px">${esc(t("noReqs"))}</div>`}</div>
   </div>
   <div class="card"><h3>${esc(t("team"))} · ${team.length}</h3><div class="tbl"><table><tr><th>${esc(t("oName"))}</th><th>${esc(t("phone"))}</th><th>${esc(t("role"))}</th><th>${esc(t("status"))}</th><th></th></tr>
    ${team.map(x=>`<tr class="${x.status==="blocked"?"blk":""}"><td><b>${esc(x.name)}</b>${x.role==="waiter"?` <span class="pill ${x.tipQr?"st-ready":"st-served"}" title="${esc(t("tipQr"))}">QR ${x.tipQr?"✓":"—"}</span>`:""}${x.id===ST.device?` <span class="dim">· ${esc(t("thisPhone"))}</span>`:""}</td><td>${esc(x.phone)}</td><td>${x.role==="owner"?esc(t("r_owner")):`<select data-role-s="${x.id}" aria-label="role">${ROLE_OPTS.map(r=>`<option value="${r}" ${x.role===r?"selected":""}>${esc(roleName(r))}</option>`).join("")}</select>`}</td><td>${x.status==="blocked"?`<span class="pill st-late">${esc(t("stBlocked"))}</span>`:ST.shift[x.id]?`<span class="pill st-ready">${esc(t("onShift"))}</span>`:`<span class="pill st-served">${esc(t("stActive"))}</span>`}</td><td class="acts">${x.role==="owner"?"":`<button class="btn ghost sm" type="button" data-blk="${x.id}">${esc(x.status==="blocked"?t("unblockB"):t("blockB"))}</button><button class="btn ghost sm danger" type="button" data-del="${x.id}">${esc(t("deleteB"))}</button>`}</td></tr>`).join("")}</table></div></div>
   <div class="card"><h3>${esc(t("journal"))}</h3>${ST.log.length?`<ul class="jlog">${ST.log.slice(0,12).map(e=>`<li><span class="dim">${new Date(e.at).toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"})}</span> ${esc(t("lg_"+e.k).replace("{w}",e.who?wname(e.who):"").replace("{x}",e.k==="ok"||e.k==="role"?roleName(e.extra):e.extra))}</li>`).join("")}</ul>`:`<div class="dim">${esc(t("noLog"))}</div>`}</div>`;
  const q=el.querySelector("#qrJoin");try{if(window.QRCode){new QRCode(q,{text:joinUrl+"?c="+ST.joinCode,width:150,height:150,colorDark:"#1b1b1e",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M})}else q.textContent=ST.joinCode}catch(e){q.textContent=ST.joinCode}
  el.querySelector("#reissue").onclick=reissue;
  el.querySelector("#revSave").onclick=()=>{const g=el.querySelector("#revG").value.trim(),ta=el.querySelector("#revTa").value.trim();
    if([g,ta].some(u=>u&&!/^https:\/\/\S+$/i.test(u))){toast(t("revBad"),"","r");return}mutate(()=>{ST.rev={g,ta}});toast(t("revOk"),"","g")};
  el.querySelector("#payQrIn").onchange=e=>readQr(e.target.files[0],d=>{mutate(()=>{ST.payQr=d});toast(t("qrOk"),"","g")});
  {const d=el.querySelector("#payQrDel");if(d)d.onclick=()=>{if(!d.dataset.arm){d.dataset.arm="1";d.textContent=t("deleteSure");return}mutate(()=>{ST.payQr=""})}}
  el.querySelectorAll("[data-ok]").forEach(b=>b.onclick=()=>approve(b.dataset.ok,el.querySelector(`[data-rrole="${b.dataset.ok}"]`).value));
  el.querySelectorAll("[data-rej]").forEach(b=>b.onclick=()=>reject(b.dataset.rej));
  el.querySelectorAll("[data-blk]").forEach(b=>b.onclick=()=>block(b.dataset.blk));

  el.querySelectorAll("[data-role-s]").forEach(sl=>sl.onchange=()=>setRole(sl.dataset.roleS,sl.value));
}
function rJoin(el){const d=ST.device?staffBy(ST.device):null;const st=d?d.status:"none";
  let body="";

    <label class="fl"><span>${esc(t("jName"))}</span><input id="jName" type="text" autocomplete="name" placeholder="Nguyễn Văn A"></label>
    <label class="fl"><span>${esc(t("phone"))}</span><input id="jPhone" type="tel" autocomplete="tel" placeholder="+84 …"></label>

    <button class="btn" type="button" id="jSend">${esc(t("jSend"))}</button><p class="dim" style="margin:0;font-size:12px">${esc(t("jNote"))}</p>`;

  else if(st==="active")body=`<div class="jstate ok"><div class="dot"></div><b>${esc(t("jOk"))}</b><span class="muted">${esc(d.name)} · ${esc(roleName(d.role))}</span></div><button class="btn" type="button" id="jOpen">${esc(t("jOpen"))}</button>`;
  else if(st==="blocked")body=`<div class="jstate bad"><div class="dot"></div><b>${esc(t("jBlocked"))}</b><span class="muted">${esc(d.name)}</span></div>`;

  el.innerHTML=`<div class="jphone"><div class="jh"><span class="mono">C</span><div><b>Café Chez Oanh</b><small>${esc(t("jTitle"))} · ${esc(ST.joinCode)}</small></div></div><div class="jb">${body}</div></div><p class="dim" style="text-align:center;margin:4px 0 0;font-size:12px">${esc(t("jDemo"))}</p>`;
  const sb=el.querySelector("#jSend");if(sb)sb.onclick=()=>{const n=el.querySelector("#jName").value.trim(),p=el.querySelector("#jPhone").value.trim();if(n.length<2||p.replace(/\D/g,"").length<8){toast(t("jErr"),"","r");return}const f=el.querySelector("#jTip").files[0];if(f)readQr(f,d=>joinReq(n,p,d));else joinReq(n,p)};

}
function rOwner(el){const all=ST.orders.filter(o=>o.status==="served");const open=live().filter(o=>o.status!=="served");
  const rev=all.reduce((s,o)=>s+tot(o),0);const billIds=[...new Set(all.map(o=>o.bill))];const avg=billIds.length?rev/billIds.length:0;const openB=Object.values(ST.bills).filter(b=>!b.closed).length;
  const accT=all.filter(o=>o.acceptedAt&&o.src==="qr").map(o=>(o.acceptedAt-o.createdAt)/1000);const cookT=all.filter(o=>o.readyAt&&o.sentAt).map(o=>(o.readyAt-o.sentAt)/60000);
  const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
  const per=ST.staff.filter(s=>s.role==="waiter"&&s.status!=="deleted"&&s.status!=="pending"&&s.status!=="rejected").map(w=>{const os=all.filter(o=>o.waiter===w.id);const r=os.reduce((s,o)=>s+tot(o),0);const ac=os.filter(o=>o.src==="qr"&&o.acceptedAt).map(o=>(o.acceptedAt-o.createdAt)/1000);
    return {w,n:os.length,r,avg:os.length?r/os.length:0,acc:mean(ac),late:os.filter(o=>o.lateAccept||o.escalated).length}}).sort((a,b)=>b.r-a.r);
  const items={};all.forEach(o=>o.items.forEach(i=>{items[i.mid]=(items[i.mid]||0)+i.qty}));const top=Object.entries(items).sort((a,b)=>b[1]-a[1]).slice(0,6);const topMax=top.length?top[0][1]:1;
  const lg={};all.forEach(o=>{lg[o.lang]=(lg[o.lang]||0)+1});const lgs=Object.entries(lg).sort((a,b)=>b[1]-a[1]);const lgMax=lgs.length?lgs[0][1]:1;
  const hrs={};for(let h=7;h<=22;h++)hrs[h]=0;all.forEach(o=>{const h=new Date(o.createdAt).getHours();if(h in hrs)hrs[h]+=tot(o)});const hMax=Math.max(1,...Object.values(hrs));
  const nopt=[["taker",t("nTaker"),t("nTakerD")],["all",t("nAll"),t("nAllD")],["esc",t("nEsc"),t("nEscD")]];
  el.innerHTML=`<div class="row"><h2>${esc(t("oToday"))}</h2><span class="sp"></span><span class="seed">${esc(t("oSeed"))}</span></div>
   <div class="kpis">
    <div class="kpi"><small>${esc(t("oRev"))}</small><b>${short(rev)} ₫</b><span>${vnd(rev)}</span></div>
    <div class="kpi"><small>${esc(t("oBills"))}</small><b>${billIds.length}</b><span>${esc(t("oOpen"))}: ${openB} · ${esc(t("oOrders"))}: ${all.length}</span></div>
    <div class="kpi"><small>${esc(t("oAvg"))}</small><b>${short(avg)} ₫</b><span>&nbsp;</span></div>
    <div class="kpi"><small>${esc(t("oAccept"))}</small><b>${Math.round(mean(accT))} ${esc(t("sec"))}</b><span>QR → ${esc(t("sAccepted"))}</span></div>
    <div class="kpi"><small>${esc(t("oCook"))}</small><b>${mean(cookT).toFixed(1)} ${esc(t("min"))}</b><span>${esc(t("sCooking"))} → ${esc(t("sReady"))}</span></div>
   </div>
   <div class="card"><h3>${esc(t("oWaiters"))}</h3><div class="tbl"><table><tr><th>${esc(t("oName"))}</th><th>${esc(t("oShift"))}</th><th>${esc(t("oOrd"))}</th><th>${esc(t("oRevS"))}</th><th>${esc(t("oAvgS"))}</th><th>${esc(t("oAcc"))}</th><th>${esc(t("oLate"))}</th></tr>
     ${per.map((p,pi)=>`<tr><td><span class="av" style="--c:var(--c${pi%6+1})">${esc(p.w.name[0])}</span><b>${esc(p.w.name)}</b></td><td>${ST.shift[p.w.id]?'<span class="pill st-ready">●</span>':'<span class="dim">—</span>'}</td><td>${p.n}</td><td>${vnd(p.r)}</td><td>${short(p.avg)}</td><td>${p.n?Math.round(p.acc)+" "+esc(t("sec")):"—"}</td><td>${p.late?`<span class="pill st-late">${p.late}</span>`:"0"}</td></tr>`).join("")}</table></div></div>
   <div class="two">
    <div class="card"><h3>${esc(t("oTop"))}</h3><div class="bars">${top.map(([k,v])=>`<div class="bar"><span>${esc(nm(k,ST.lang==="ru"?"ru":"vi"))}</span><i style="width:${Math.max(4,v/topMax*100)}%"></i><span>${v}</span></div>`).join("")}</div></div>
    <div class="card"><h3>${esc(t("oLang"))}</h3><div class="bars">${lgs.map(([k,v])=>`<div class="bar"><span>${esc(LANGNAME[k]||k)}</span><i style="width:${Math.max(4,v/lgMax*100)}%"></i><span>${Math.round(v/all.length*100)}%</span></div>`).join("")}</div></div>
   </div>
   <div class="card"><h3>${esc(t("oHours"))}</h3><div class="hours">${Object.entries(hrs).map(([h,v])=>`<div title="${h}:00 · ${vnd(v)}"><i style="height:${v/hMax*100}%"></i><small>${h}</small></div>`).join("")}</div></div>
   <div class="card"><h3>${esc(t("oSettings"))}</h3><div class="radio">${nopt.map(([k,a,b])=>`<label><input type="radio" name="notify" value="${k}" ${ST.notify===k?"checked":""}><span><b>${esc(a)}</b><br><span class="dim">${esc(b)}</span></span></label>`).join("")}</div></div>`;
  el.querySelectorAll("input[name=notify]").forEach(r=>r.onchange=()=>mutate(()=>{ST.notify=r.value}));
}

render();importInbox();
