<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sun&Sea · Заказать</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f0e5;color:#243c30;font:16px system-ui}header{padding:24px;background:#193c32;color:#fff8e8}main{max-width:960px;margin:auto;padding:18px 18px 230px}h1{font:600 30px Georgia;margin:0}p{line-height:1.5}details{background:#fffaf0;border:1px solid #b9c0a5;border-radius:18px;margin:12px 0;padding:16px}summary{cursor:pointer;font-weight:700}article{padding:16px 0;border-top:1px solid #d9dbcc;margin-top:12px;display:grid;gap:8px}article p{margin:0}button,input{font:inherit;min-height:44px;border:1px solid #9fae97;border-radius:10px;padding:10px;background:#fffaf0;color:#193c32}button{cursor:pointer;background:linear-gradient(135deg,#ead7a1,#bfa16b)}button:disabled{opacity:.5}textarea{font:inherit;padding:10px;width:100%;border-radius:10px;border:1px solid #9fae97}footer{position:fixed;bottom:0;left:0;right:0;padding:16px;background:#e9eaddf5;backdrop-filter:blur(18px);border-top:1px solid #9fae97;box-shadow:0 -8px 30px #193c3218}footer form{max-width:960px;margin:auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center}footer label{display:grid;gap:5px;flex:1}#status{margin:0;width:100%}#total{font-size:22px}label small{display:block}.quantity{display:flex;align-items:center;gap:15px}#success{padding:35px;background:#e9eddf;border-radius:20px}a{color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #a26942;outline-offset:2px}</style>
<header><h1>Sun&Sea</h1><p id="intro">Выберите блюда. Официант свяжется с вами и назначит стол.</p></header><main><p id="loading" role="status">Загружаем меню…</p><div id="catalog"></div><section id="success" hidden><h2>Заказ отправлен</h2><p>Официант увидит заказ в приложении и свяжется с вами по указанному телефону.</p><a href="./">Вернуться к меню</a></section></main>
<footer><form id="cart"><strong id="total">0 ₫</strong><label>Телефон для связи<input name="phone" type="tel" autocomplete="tel" placeholder="+84 90 123 45 67" required pattern="\+[1-9][0-9 ()-]{7,24}" maxlength="25"><small>Международный формат: +код страны и номер</small></label><button type="submit" id="send" disabled>Отправить заказ</button><p id="status" role="status" aria-live="polite"></p></form></footer>
<script src="../app/sunsea-numbers.js"></script><script src="order-categories.js"></script><script src="web-order.js"></script></html>
