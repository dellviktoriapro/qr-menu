<title>Chez Oanh Order Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap">
<style>
/* Layout: staff app in two skins chosen by the user (body[data-skin]).
   Dark = onyx black with warm gold and silver hairlines. Light = ivory / crème brûlée with espresso ink and caramel accents.
   Top bar = brand + role switch + tools; panes hold Guest / Waiter / Kitchen / Owner. */
:root{
  --f:"Montserrat",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --fd:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif;
  --r:20px; --r2:14px;
  /* dark skin (default) */
  --bg:#1b1b1e; --bg2:#222225; --card:#29292d; --card2:#303035; --glass:rgba(27,27,30,.78);
  --line:rgba(255,255,255,.06); --line2:rgba(255,255,255,.13); --silver:#b8bbc1;
  --ink:#ecebe8; --muted:#a4a19b; --dim:#6f6d69;
  --acc:#e77a43; --acc2:#f4a774; --acc-ink:#1c0f07; --grad:linear-gradient(135deg,#f7ad78 0%,#e77a43 48%,#b9512a 100%);
  --hot:#ff8a4c; --hot-glow:rgba(255,128,64,.55);
  --new:#ecebe8; --cook:#8fa6bd; --ready:#ff8a4c; --late:#ff5a48; --acc-st:#e3ab5c; --served:#6f6d69;
  /* palette from the graphite/copper reference: copper, sunset peach, brass, steel blue, silver, dusk rose */
  --c1:#e77a43; --c2:#8fa6bd; --c3:#d9a65a; --c4:#c08f86; --c5:#c4c7cc; --c6:#f2b28c;
  /* 8 clearly different table colours (copper, steel blue, brass, teal, dusk rose, plum, sage, peach) */
  --t1:#e77a43; --t2:#6f97c9; --t3:#d9a94f; --t4:#4fa59f; --t5:#d07a8a; --t6:#9a80c4; --t7:#8fae7f; --t8:#f2b28c;
  --paper:#26262a; --paper2:#2f2f34; --paper-ink:#ecebe8; --paper-dim:#8f8c86; --paper-line:rgba(255,255,255,.07);
  --shadow:0 18px 40px -18px rgba(0,0,0,.75),0 1px 0 rgba(255,255,255,.045) inset;
  --glow:radial-gradient(1100px 520px at 88% -12%,rgba(231,122,67,.10),transparent 60%),radial-gradient(900px 520px at -10% 110%,rgba(184,187,193,.05),transparent 60%);
  color-scheme:dark;
}
body[data-skin="light"]{
  /* Japandi: warm ivory, stone beige, warm taupe, sage, natural wood, terracotta, deep brown, soft charcoal */
  --bg:#ede6db; --bg2:#e5dccf; --card:#f6f1e9; --card2:#e9e0d2; --glass:rgba(237,230,219,.82);
  --line:#d6ccbd; --line2:#afa091; --silver:#8a7d70;
  --ink:#2d2d2d; --muted:#5b4e43; --dim:#8b7e70;
  --acc:#b8683f; --acc2:#b88b60; --acc-ink:#fbf7f0; --grad:linear-gradient(135deg,#d39271 0%,#b8683f 50%,#8f4a2a 100%);
  --hot:#c0623a; --hot-glow:rgba(192,98,58,.38);
  --new:#4b3e33; --cook:#6f7d64; --ready:#c0623a; --late:#97362a; --acc-st:#a8794e; --served:#afa091;
  /* Japandi swatches: terracotta, olive, sage, natural wood, slate, soft terracotta */
  --c1:#b8683f; --c2:#7f8a74; --c3:#b88b60; --c4:#6f7774; --c5:#d39a7c; --c6:#6e7550;
  /* only swatches from the Japandi references: terracotta, olive, natural wood, slate, soft terracotta, forest linen, light sage, deep brown */
  --t1:#c06a45; --t2:#6e7350; --t3:#b88b60; --t4:#6f7774; --t5:#a39582; --t6:#4c5747; --t7:#a7ad86; --t8:#5a4637;
  --paper:#f8f4ec; --paper2:#ede5d8; --paper-ink:#2d2d2d; --paper-dim:#857868; --paper-line:#ddd3c4;
  --shadow:0 18px 40px -24px rgba(75,62,51,.35),0 1px 0 rgba(255,255,255,.7) inset;
  --glow:radial-gradient(1100px 520px at 90% -10%,rgba(127,138,116,.16),transparent 60%),radial-gradient(900px 520px at -10% 110%,rgba(184,139,96,.14),transparent 60%);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:#1b1b1e}
body{margin:0;background:var(--bg);background-image:var(--glow);background-attachment:fixed;color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;transition:background-color .35s,color .35s}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);border-bottom:1px solid var(--line)}
.top .in{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:12px 20px;max-width:1540px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.brand .mono{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--fd);font-weight:600;font-size:20px;font-style:italic;color:var(--acc-ink);background:var(--grad);box-shadow:0 0 0 1px var(--line2),0 6px 18px -6px var(--hot-glow)}
.brand .bt{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand b{font-family:var(--fd);font-size:23px;font-weight:600;letter-spacing:.01em}
.brand small{color:var(--dim);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;margin-top:3px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.seg button{border:0;background:transparent;border-radius:999px;padding:8px 15px;font-weight:600;font-size:12.5px;letter-spacing:.03em;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:7px;transition:color .2s,background .2s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--grad);color:var(--acc-ink);box-shadow:0 6px 18px -6px var(--hot-glow)}
.seg .cnt{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--late);color:#fff;font-size:10.5px;font-weight:700;display:inline-grid;place-items:center}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chipbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 13px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;transition:border-color .2s,color .2s}
.chipbtn:hover{border-color:var(--line2);color:var(--ink)}
.chipbtn.on{color:var(--acc);border-color:var(--acc)}
.skin{width:36px;height:36px;padding:0;display:grid;place-items:center;border:1px solid var(--line);background:var(--card);border-radius:999px;color:var(--acc);transition:border-color .2s,transform .3s}
.skin:hover{border-color:var(--acc)}
.skin:active{transform:rotate(-30deg)}
.skin svg{width:17px;height:17px}
.skin .sun,body[data-skin="light"] .skin .moon{display:none}
body[data-skin="light"] .skin .sun{display:block}
.demo{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:8px 20px 10px;max-width:1540px;margin:0 auto;font-size:12px;color:var(--dim)}
.demo button{border:1px dashed var(--line2);background:transparent;color:var(--acc);border-radius:999px;padding:6px 12px;font-weight:600;font-size:12px}
.demo button:hover{border-style:solid}
.demo button:disabled{opacity:.4;cursor:not-allowed}

/* panes */
.panes{display:grid;gap:20px;padding:22px 20px;max-width:1540px;margin:0 auto;padding-bottom:calc(48px + env(safe-area-inset-bottom,0px))}
.panes.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:900px){.panes.split{grid-template-columns:1fr}}
@media (max-width:520px){.top .in,.demo{padding-inline:14px}.panes{padding-inline:14px}}
.pane{min-width:0;background:linear-gradient(180deg,var(--bg2),color-mix(in srgb,var(--bg2) 92%,#000));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.pane>.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line)}
.pane>.ph b{font-family:var(--fd);font-size:22px;font-weight:600;letter-spacing:.01em;color:var(--ink);text-transform:none}
.pane>.ph b::after{content:"";display:inline-block;width:28px;height:1px;background:var(--acc);vertical-align:middle;margin-left:12px;opacity:.7}
.pane>.pb{padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.single .pane{max-width:940px;margin:0 auto;width:100%}
.single .pane.guest{max-width:440px}
.single .pane.owner{max-width:1180px}

h2{margin:0;font-family:var(--fd);font-size:30px;font-weight:600;line-height:1.05;text-wrap:balance}
h3{margin:0;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.btn{position:relative;overflow:hidden;isolation:isolate;border:0;border-radius:999px;padding:11px 18px;font-weight:700;font-size:13px;letter-spacing:.02em;background:var(--grad);color:var(--acc-ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 8px 22px -10px var(--hot-glow),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .15s,filter .15s,box-shadow .2s}
.btn::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%);pointer-events:none}
.btn:hover::after{animation:shine .9s ease}
.btn:hover{box-shadow:0 10px 28px -8px var(--hot-glow),inset 0 1px 0 rgba(255,255,255,.3)}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--ink);font-weight:600;box-shadow:none}
/* "ready" actions: hot copper, glowing + shimmering on their own */
.btn.green{background:linear-gradient(135deg,#ffc08f 0%,var(--hot) 45%,#c9461c 100%);color:#1c0b04;box-shadow:0 0 0 1px rgba(255,170,120,.35),0 8px 26px -6px var(--hot-glow)}
body[data-skin="light"] .btn.green{color:#fff}
@media (prefers-reduced-motion:no-preference){
 .btn.green{animation:glow 2.2s ease-in-out infinite}
 .btn.green::after{animation:shine 2.6s ease-in-out infinite}
 @keyframes glow{50%{box-shadow:0 0 0 1px rgba(255,170,120,.55),0 0 26px 2px var(--hot-glow)}}
}
@keyframes shine{0%{transform:translateX(-120%)}60%,100%{transform:translateX(120%)}}
.btn.blue{background:var(--card2);color:var(--ink);border:1px solid var(--line2);box-shadow:none}
.btn.sm{padding:8px 14px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;letter-spacing:.05em;white-space:nowrap;border:1px solid currentColor}
.st-new{color:var(--new)}
.st-accepted{color:var(--acc2)}
.st-cooking{color:var(--cook)}
.st-ready{color:var(--ready);box-shadow:0 0 12px -3px var(--hot-glow)}
.pill.st-new{background:color-mix(in srgb,var(--new) 8%,transparent)}
.st-served{color:var(--dim)}
.st-late{color:var(--late)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--card2);color:var(--ink);border-color:var(--acc);box-shadow:inset 0 -2px 0 var(--acc)}
.empty{padding:34px 10px;text-align:center;color:var(--dim);border:1px dashed var(--line2);border-radius:var(--r2);font-family:var(--fd);font-style:italic;font-size:19px}

/* order cards */
.oc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:14px 16px 14px 20px;display:flex;flex-direction:column;gap:10px;min-width:0;overflow:hidden}
.oc::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--line2)}
.oc.s-new::before{background:var(--new)}.oc.s-accepted::before{background:var(--acc2)}.oc.s-cooking::before{background:var(--cook)}.oc.s-ready::before{background:var(--grad);box-shadow:0 0 12px var(--hot-glow)}
.oc.s-ready{border-color:color-mix(in srgb,var(--hot) 40%,var(--line))}
.oc.s-served{opacity:.7}
.oc.late{border-color:var(--late)}
@media (prefers-reduced-motion:no-preference){.oc.late{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 3px color-mix(in srgb,var(--late) 25%,transparent)}}}
.oh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.oh .tb{font-family:var(--fd);font-size:30px;font-weight:600;line-height:1;letter-spacing:-.01em}
.oh .no{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.oh .tm{margin-left:auto;font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)}
.meta{font-size:12px;color:var(--dim)}
.lines{list-style:none;margin:0;padding:10px 0 0;display:flex;flex-direction:column;gap:7px;border-top:1px solid var(--line)}
.lines li{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:start}
.lines .q{font-family:var(--fd);font-weight:700;font-size:20px;line-height:1.1;color:var(--acc);font-variant-numeric:tabular-nums}
.lines .n{min-width:0}
.lines .n b{font-weight:600}
.lines .n .tr{display:block;font-size:11.5px;color:var(--dim)}
.lines .n .note{display:inline-block;margin-top:4px;font-size:11.5px;color:var(--acc);border:1px solid var(--line2);border-radius:999px;padding:1px 8px}
.lines .p{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;white-space:nowrap}
.cmt{font-size:13px;font-style:italic;background:var(--card2);border-left:2px solid var(--acc);border-radius:0 10px 10px 0;padding:8px 12px}
.wish{display:flex;flex-wrap:wrap;gap:5px}
.wish span{font-size:11px;font-weight:600;border-radius:999px;padding:2px 9px;color:var(--late);border:1px solid color-mix(in srgb,var(--late) 50%,transparent)}
.of{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:2px}
.of .tot{margin-right:auto;font-family:var(--fd);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.badge-new{font-size:10px;font-weight:800;color:var(--acc-ink);background:var(--grad);border-radius:999px;padding:1px 6px;margin-left:5px;vertical-align:1px}
.steps{display:flex;gap:4px;align-items:center}
.steps i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--grad)}

/* waiter */
.who{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px;flex-wrap:wrap}
.who select{background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:8px 12px}
.shift{border:0;border-radius:999px;padding:9px 15px;font-weight:700;font-size:12.5px}
.shift.on{background:transparent;color:var(--hot);border:1px solid var(--hot);box-shadow:0 0 16px -4px var(--hot-glow),inset 0 0 10px -4px var(--hot-glow)}
.shift.off{background:transparent;color:var(--muted);border:1px solid var(--line2)}
.alert{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:linear-gradient(90deg,color-mix(in srgb,var(--hot) 16%,transparent),transparent);border:1px solid color-mix(in srgb,var(--hot) 55%,transparent);box-shadow:0 0 22px -10px var(--hot-glow);border-radius:var(--r2);padding:10px 14px;font-weight:600}
.alert.red{background:color-mix(in srgb,var(--late) 10%,transparent);border-color:color-mix(in srgb,var(--late) 50%,transparent)}
.alert .sp{flex:1}

/* kitchen tickets */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.kc{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0;box-shadow:var(--shadow)}
.kc .kh{display:flex;align-items:baseline;gap:8px;padding:12px 14px;border-bottom:1px dashed var(--paper-line);background:linear-gradient(90deg,color-mix(in srgb,var(--cook) 18%,transparent),transparent)}
.kc.ready .kh{background:linear-gradient(90deg,color-mix(in srgb,var(--hot) 26%,transparent),transparent)}
.kc.ready{border-color:color-mix(in srgb,var(--hot) 45%,var(--paper-line));box-shadow:0 0 26px -12px var(--hot-glow),var(--shadow)}
.kc.slow .kh{background:linear-gradient(90deg,color-mix(in srgb,var(--late) 26%,transparent),transparent)}
.kc .kh .tb{font-family:var(--fd);font-size:28px;font-weight:700;line-height:1}
.kc .kh .tm{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;color:var(--cook)}
.kc.slow .kh .tm{color:var(--late)}
.kc.ready .kh .tm{color:var(--ready)}
.kc .kb{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.kc .ki{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start;border:0;background:transparent;text-align:left;padding:5px 0;color:inherit;border-bottom:1px solid var(--paper-line)}
.kc .ki:last-of-type{border-bottom:0}
.kc .ki .q{font-family:var(--fd);font-size:22px;font-weight:700;line-height:1;color:var(--acc)}
.kc .ki b{font-size:15px;font-weight:600;line-height:1.3}
.kc .ki .note{display:block;font-size:12.5px;font-weight:700;color:var(--late);margin-top:2px}
.kc .ki .sub{display:block;font-size:11.5px;color:var(--paper-dim)}
.kc .ki.done b,.kc .ki.done .q{text-decoration:line-through;opacity:.4}
.kc .ki .stn{font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--paper-dim);margin-left:6px;border:1px solid var(--paper-line);border-radius:999px;padding:0 6px;vertical-align:2px}
.kc .kcm{font-size:13px;font-style:italic;background:var(--paper2);border-left:2px solid var(--acc);border-radius:0 8px 8px 0;padding:7px 10px}
.kc .kw{font-size:12px;font-weight:700;color:var(--late)}
.kc .kf{padding:10px 14px;border-top:1px solid var(--paper-line);display:flex;gap:8px;align-items:center}
.kc .kf .meta{color:var(--paper-dim)}

/* guest phone */
.phone{background:var(--bg);border-radius:30px;border:1px solid var(--line2);overflow:hidden;box-shadow:var(--shadow)}
.gh{padding:16px;background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 22%,var(--card)),var(--card));display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.gh b{font-family:var(--fd);font-size:24px;font-weight:600}
.gh small{display:block;color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.gl{display:flex;gap:3px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:3px}
.gl button{border:0;background:transparent;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700;color:var(--muted)}
.gl button.on{background:var(--grad);color:var(--acc-ink)}
.gm{padding:6px 14px 12px;display:flex;flex-direction:column;max-height:560px;overflow:auto}
.gi{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.gi img{width:60px;height:60px;border-radius:14px;object-fit:cover;background:var(--card)}
.gi .nm{font-weight:600;font-size:13.5px;line-height:1.25}
.gi .pr{color:var(--acc);font-family:var(--fd);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.qa{display:flex;align-items:center;gap:5px}
.qa button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line2);background:transparent;color:var(--acc);font-weight:700;font-size:16px;line-height:1;transition:background .15s,color .15s}
.qa button:hover{background:var(--grad);color:var(--acc-ink);border-color:transparent}
.qa b{min-width:16px;text-align:center;font-variant-numeric:tabular-nums}
.gsec{font-family:var(--fd);font-style:italic;font-size:20px;color:var(--acc);padding:14px 0 2px}
.gbar{padding:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;background:var(--card)}
.gtrack{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;display:flex;flex-direction:column;gap:7px}
.gtrack .lab{font-size:12.5px;font-weight:700}

/* owner */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{position:relative;background:linear-gradient(180deg,var(--card2),var(--card));box-shadow:var(--shadow);border:1px solid var(--line);border-radius:var(--r2);padding:14px 16px;overflow:hidden}
.kpi::after{content:"";position:absolute;left:16px;top:16px;width:6px;height:6px;border-radius:50%;background:var(--hot);box-shadow:0 0 10px var(--hot-glow)}
.kpi small{padding-left:14px}
.kpi small{display:block;color:var(--dim);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.kpi b{display:block;font-family:var(--fd);font-size:34px;font-weight:600;line-height:1.05;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;color:var(--muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r2)}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:11px 14px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--dim);font-weight:700;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;background:var(--card2)}
td b{font-weight:600}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(90px,160px) 1fr 52px;gap:12px;align-items:center;font-size:12.5px}
.bar i{display:block;height:8px;border-radius:5px;background:var(--grad)}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.hours{display:flex;align-items:flex-end;gap:5px;height:140px;padding-top:6px;border-bottom:1px solid var(--line)}
.hours div{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;height:100%;justify-content:flex-end}
.hours i{display:block;width:100%;max-width:26px;border-radius:6px 6px 0 0;background:var(--grad);min-height:2px;opacity:.9}
.hours small{font-size:10px;color:var(--dim)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.pbar{display:flex;flex-direction:column;gap:10px}
.pcust{display:flex;gap:10px;flex-wrap:wrap}.pcust label{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:600}
.pcust input{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--ink);font:inherit}
.kpi em{display:block;font-style:normal;font-size:11.5px;font-weight:700;margin-top:4px}.kpi em.dlu{color:#6fbf86}.kpi em.dld{color:var(--late)}.kpi em.dl0{color:var(--dim)}
body[data-skin="light"] .kpi em.dlu{color:#5d7a4f}
.hours.days{gap:3px}.hours.days.dense{gap:1px}.hours.days small{font-size:9.5px}
.seed{font-size:11px;color:var(--dim);border:1px dashed var(--line2);border-radius:999px;padding:5px 11px}
.radio{display:flex;flex-direction:column;gap:7px}
.radio label{display:flex;gap:10px;align-items:flex-start;font-size:13px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.radio label:has(input:checked){border-color:var(--acc)}
.radio input{margin-top:3px;accent-color:var(--acc)}

/* editor sheet */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
.sheet .sp2{width:100%;max-width:660px;max-height:92vh;overflow:auto;background:var(--bg2);border:1px solid var(--line2);border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
@media (min-width:700px){.sheet{align-items:center}.sheet .sp2{border-radius:24px}}
.ed{display:flex;flex-direction:column;gap:8px}
.edl{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.edl .nm{font-weight:600;min-width:0}
.edl input{grid-column:1/-1;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;width:100%}
.ta{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-height:68px;resize:vertical}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.picker button{display:flex;gap:8px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;font-size:12.5px;min-width:0}
.picker button:hover{border-color:var(--acc)}
.picker img{width:36px;height:36px;border-radius:9px;object-fit:cover;flex:none}
.picker span{min-width:0}
.wchips{display:flex;flex-wrap:wrap;gap:6px}
.wchips button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:12px;color:var(--muted)}
.wchips button[aria-pressed="true"]{border-color:var(--late);color:var(--late);background:color-mix(in srgb,var(--late) 10%,transparent)}

.toasts{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;max-width:min(360px,calc(100vw - 36px))}
.toast{background:var(--card2);color:var(--ink);border:1px solid var(--line2);border-left:3px solid var(--acc);border-radius:12px;padding:11px 14px;font-weight:600;font-size:13px;box-shadow:var(--shadow);display:flex;gap:8px;align-items:flex-start}
.toast.g{border-left-color:var(--hot);box-shadow:0 0 24px -10px var(--hot-glow),var(--shadow)}.toast.r{border-left-color:var(--late)}.toast.b{border-left-color:var(--cook)}
.toast small{display:block;font-weight:500;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.toast{animation:tin .3s ease-out}@keyframes tin{from{transform:translateY(10px);opacity:0}}.pane{animation:pin .35s ease-out}@keyframes pin{from{transform:translateY(6px);opacity:.4}}}

.pill.rnd{color:var(--acc2);border-style:dashed}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.tc{display:flex;flex-direction:column;gap:6px;text-align:left;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:14px;color:var(--ink);box-shadow:var(--shadow);transition:border-color .2s,transform .15s}
.tc:hover{border-color:var(--acc);transform:translateY(-1px)}
.tc.req{border-color:var(--late);box-shadow:0 0 0 1px var(--late),0 0 22px color-mix(in srgb,var(--late) 35%,transparent);animation:reqp 2s ease-in-out infinite}
@keyframes reqp{50%{box-shadow:0 0 0 1px var(--late),0 0 34px color-mix(in srgb,var(--late) 55%,transparent)}}
.breq{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:var(--late);border-radius:999px;padding:3px 9px}
.reqbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px;padding:12px 14px;border-radius:14px;border:1px solid var(--late);background:color-mix(in srgb,var(--late) 12%,var(--card))}
.reqbar b{color:var(--late);font-size:15px}.reqbar span{color:var(--muted);font-size:13px;flex:1}
@media (prefers-reduced-motion:reduce){.tc.req{animation:none}}
.tc .tn{font-family:var(--fd);font-size:28px;font-weight:600;line-height:1}
.tc .tsum{font-family:var(--fd);font-size:24px;font-weight:700;color:var(--acc)}
.tc .tst{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.tc .tst i{width:10px;height:10px;border-radius:50%;background:var(--dim)}
.tc .tst i.d-new{background:var(--new)}.tc .tst i.d-accepted{background:var(--acc2)}.tc .tst i.d-cooking{background:var(--cook)}.tc .tst i.d-ready{background:var(--hot);box-shadow:0 0 8px var(--hot-glow)}
.tc .tst small{font-size:11px;color:var(--muted);margin-left:4px}
.rounds{display:flex;flex-wrap:wrap;gap:6px}
.btot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line2);padding-top:12px}
.btot span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.btot b{font-family:var(--fd);font-size:36px;font-weight:700;color:var(--acc)}
.gbill{display:flex;justify-content:space-between;align-items:baseline;margin:12px 12px 0;padding:10px 14px;border:1px solid var(--line2);border-radius:14px;background:var(--card)}
.gbill span{font-size:12px;color:var(--muted)}
.gbill b{font-family:var(--fd);font-size:22px;color:var(--acc)}
.pill.own{color:var(--hot);box-shadow:0 0 10px -3px var(--hot-glow)}
.oc.other{opacity:.62}
.wait{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;border:1px dashed var(--line2);border-radius:999px;padding:6px 12px}
.cnt2{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--hot);color:#fff;font-size:10.5px;margin-left:4px}
.qrbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.payqr{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qrimg{width:150px;height:150px;object-fit:contain;border-radius:12px;background:#fff;padding:6px;border:1px solid var(--line);flex:none}
.qrnone{width:150px;height:150px;border-radius:12px;border:1.5px dashed var(--line2);display:grid;place-items:center;text-align:center;padding:10px;font-size:12px;color:var(--muted);flex:none}
.payqr .qrt{flex:1;min-width:180px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
/* waiter has no tip QR yet: the button itself glows instead of a separate warning */
.btn.tipneed{animation:tipglow 1.8s ease-in-out infinite}
@keyframes tipglow{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 30%,transparent),0 0 18px var(--hot-glow,rgba(231,122,67,.5))}}
@media (prefers-reduced-motion:reduce){.btn.tipneed{animation:none}}
.upl{position:relative;overflow:hidden}.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ckpill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:700;background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc);border:1px solid color-mix(in srgb,var(--acc) 45%,transparent)}
.pmbox{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border:1px solid var(--line2);border-radius:14px;background:var(--card)}
.pmbox>b{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pmrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.pmrow .pmn{flex:1 1 100%;font-weight:700;font-size:13.5px}
.pmrow .chipbtn{font-size:13px;padding:9px 14px}.pmrow .chipbtn.on{background:color-mix(in srgb,var(--acc) 14%,transparent);font-weight:800}
.ckh{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 2px;padding-top:10px;border-top:1px dashed var(--line2)}
.ckh b{font-size:15px}.ckh span{font-variant-numeric:tabular-nums;font-weight:700;color:var(--acc)}
.fl.file input{padding:9px 10px;font-size:13px}
.qr{width:166px;height:166px;padding:8px;background:#fff;border-radius:14px;display:grid;place-items:center;box-shadow:0 0 0 1px var(--line2),0 10px 26px -14px var(--hot-glow);flex:none;color:#1b1b1e;font-weight:700}
.qr img,.qr canvas{display:block}
.qrt{flex:1;min-width:180px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.code{font-family:var(--fd);font-size:30px;font-weight:700;letter-spacing:.08em;color:var(--acc)}
.req{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--bg2)}
.req .rq1{display:flex;flex-direction:column}
.req select,td select{background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12.5px}
td.acts{display:flex;gap:6px;justify-content:flex-end}
tr.blk td{opacity:.6}
.btn.danger{color:var(--late);border-color:color-mix(in srgb,var(--late) 50%,transparent)}
.jlog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.jphone{max-width:380px;margin:0 auto;width:100%;border:1px solid var(--line2);border-radius:28px;overflow:hidden;background:var(--bg);box-shadow:var(--shadow)}
.jh{display:flex;gap:12px;align-items:center;padding:16px;border-bottom:1px solid var(--line);background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 18%,var(--card)),var(--card))}
.jh .mono{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--fd);font-style:italic;font-weight:600;font-size:20px;color:var(--acc-ink);background:var(--grad);flex:none}
.jh b{font-family:var(--fd);font-size:22px;display:block}
.jh small{color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.jb{padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.fl{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:600}
.fl input{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:15px;color:var(--ink)}
.jstate{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:18px 6px}
.jstate b{font-family:var(--fd);font-size:24px}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--acc)}
@media (prefers-reduced-motion:no-preference){.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}}
.jstate .dot{width:34px;height:34px;border-radius:50%;background:var(--grad);box-shadow:0 0 18px var(--hot-glow)}
.jstate.bad .dot{background:var(--late);box-shadow:none}
.single .pane.join{max-width:460px}

/* ---- colour variety (palette per skin) ---- */
.st-accepted{color:var(--acc-st)}.st-served{color:var(--served)}
.pill.st-accepted{background:color-mix(in srgb,var(--acc-st) 13%,transparent)}
.pill.st-cooking{background:color-mix(in srgb,var(--cook) 15%,transparent)}
.pill.st-ready{background:color-mix(in srgb,var(--ready) 15%,transparent)}
.pill.st-late{background:color-mix(in srgb,var(--late) 14%,transparent)}
.pill.st-served{background:color-mix(in srgb,var(--served) 12%,transparent)}
.oc.s-accepted::before{background:var(--acc-st)}
.oc.s-new{background:linear-gradient(90deg,color-mix(in srgb,var(--new) 6%,var(--card)),var(--card) 38%)}
.oc.s-accepted{background:linear-gradient(90deg,color-mix(in srgb,var(--acc-st) 10%,var(--card)),var(--card) 40%)}
.oc.s-cooking{background:linear-gradient(90deg,color-mix(in srgb,var(--cook) 12%,var(--card)),var(--card) 40%)}
.oc.s-ready{background:linear-gradient(90deg,color-mix(in srgb,var(--ready) 13%,var(--card)),var(--card) 45%)}
.tabs button[data-wt="new"].on{border-color:var(--new);box-shadow:inset 0 -2px 0 var(--new)}
.tabs button[data-wt="mine"].on{border-color:var(--acc-st);box-shadow:inset 0 -2px 0 var(--acc-st)}
.tabs button[data-wt="ready"].on{border-color:var(--ready);box-shadow:inset 0 -2px 0 var(--ready)}
.tabs button[data-wt="tables"].on{border-color:var(--c2);box-shadow:inset 0 -2px 0 var(--c2)}
.tabs button[data-wt]::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px;background:var(--line2)}
.tabs button[data-wt="new"]::before{background:var(--new)}.tabs button[data-wt="mine"]::before{background:var(--acc-st)}
.tabs button[data-wt="ready"]::before{background:var(--ready)}.tabs button[data-wt="tables"]::before{background:var(--c2)}
.kpis .kpi:nth-child(6n+1){--k:var(--c1)}.kpis .kpi:nth-child(6n+2){--k:var(--c3)}.kpis .kpi:nth-child(6n+3){--k:var(--c4)}
.kpis .kpi:nth-child(6n+4){--k:var(--c2)}.kpis .kpi:nth-child(6n+5){--k:var(--c6)}.kpis .kpi:nth-child(6n){--k:var(--c5)}
.kpi{border-top:2px solid color-mix(in srgb,var(--k) 70%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--k) 9%,var(--card2)),var(--card))}
.kpi::after{background:var(--k);box-shadow:0 0 10px color-mix(in srgb,var(--k) 60%,transparent)}
.bars .bar:nth-child(6n+1) i{background:linear-gradient(90deg,color-mix(in srgb,var(--c1) 55%,transparent),var(--c1))}
.bars .bar:nth-child(6n+2) i{background:linear-gradient(90deg,color-mix(in srgb,var(--c3) 55%,transparent),var(--c3))}
.bars .bar:nth-child(6n+3) i{background:linear-gradient(90deg,color-mix(in srgb,var(--c4) 55%,transparent),var(--c4))}
.bars .bar:nth-child(6n+4) i{background:linear-gradient(90deg,color-mix(in srgb,var(--c2) 55%,transparent),var(--c2))}
.bars .bar:nth-child(6n+5) i{background:linear-gradient(90deg,color-mix(in srgb,var(--c6) 55%,transparent),var(--c6))}
.bars .bar:nth-child(6n) i{background:linear-gradient(90deg,color-mix(in srgb,var(--c5) 55%,transparent),var(--c5))}
.hours i{background:linear-gradient(to top,var(--c4),var(--c3) 45%,var(--c1))!important}
.av{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;margin-right:8px;font-size:11px;font-weight:800;color:#fff;background:var(--c);vertical-align:middle;box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 25%,transparent)}
.kc .ki .stn.sk{color:var(--c3);border-color:color-mix(in srgb,var(--c3) 50%,transparent)}.kc .ki .stn.sb{color:var(--c4);border-color:color-mix(in srgb,var(--c4) 50%,transparent)}
.card h3{position:relative;padding-left:14px}
.card h3::before{content:"";position:absolute;left:0;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:2px;transform:rotate(45deg);background:var(--c1)}
.two .card:nth-child(2) h3::before,.card:nth-of-type(3n+2) h3::before{background:var(--c3)}
.card:nth-of-type(3n) h3::before{background:var(--c4)}
.tc{border-top:2px solid color-mix(in srgb,var(--c2) 55%,var(--line))}
.toast.b{border-left-color:var(--cook)}
html:has(body[data-skin="light"]){background:#ede6db}

/* per-table colour (same table = same colour on every screen) */
.oc[style*="--tc"]{background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 7%,var(--card)),var(--card) 70%);border-color:color-mix(in srgb,var(--tc) 22%,var(--line))}
.oc .oh{margin:-14px -16px 0 -20px;padding:13px 16px 12px 20px;background:linear-gradient(90deg,color-mix(in srgb,var(--tc,var(--acc)) 26%,transparent),color-mix(in srgb,var(--tc,var(--acc)) 6%,transparent));border-bottom:1px dashed color-mix(in srgb,var(--tc,var(--acc)) 30%,var(--line))}
.oc .oh .tb{color:color-mix(in srgb,var(--tc,var(--ink)) 45%,var(--ink))}
.oc.late{border-color:var(--late)}
.kc .kh,.kc.slow .kh,.kc.ready .kh{background:linear-gradient(90deg,color-mix(in srgb,var(--tc,var(--cook)) 24%,transparent),color-mix(in srgb,var(--tc,var(--cook)) 5%,transparent))}
.kc{border-top:3px solid var(--tc,var(--paper-line))}
.tc[style*="--tc"]{background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 20%,var(--card2)),color-mix(in srgb,var(--tc) 5%,var(--card)) 70%);border-top:3px solid var(--tc)}
.tc .tn{color:color-mix(in srgb,var(--tc,var(--ink)) 40%,var(--ink))}
.oc::before{top:0;bottom:0;width:4px;border-radius:0;z-index:1}
body[data-skin="light"] .tc[style*="--tc"]{background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 52%,var(--card)),color-mix(in srgb,var(--tc) 18%,var(--card)) 80%)}
body[data-skin="light"] .oc .oh{background:linear-gradient(90deg,color-mix(in srgb,var(--tc,var(--acc)) 55%,transparent),color-mix(in srgb,var(--tc,var(--acc)) 16%,transparent))}
body[data-skin="light"] .kc .kh,body[data-skin="light"] .kc.slow .kh,body[data-skin="light"] .kc.ready .kh{background:linear-gradient(90deg,color-mix(in srgb,var(--tc,var(--cook)) 50%,transparent),color-mix(in srgb,var(--tc,var(--cook)) 12%,transparent))}
.oc[style*="--tc"]::before{background:var(--tc)!important;box-shadow:0 0 10px color-mix(in srgb,var(--tc) 45%,transparent)!important;width:5px}

/* owner section switch: big segmented control */
.otabs{display:flex;gap:6px;padding:6px;background:var(--card);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);max-width:520px}

function billCks(os){return os.some(o=>o.check)?[...new Set(os.map(o=>o.check||t("ckCommon")))]:[""]}
function pmInit(os,b){const r={};const reqs=b.reqs||(b.req?[b.req]:[]);
  billCks(os).forEach(k=>{const q=reqs.find(x=>(x.check||"")===(k===t("ckCommon")?"":k))||(reqs.length===1&&!reqs[0].check?reqs[0]:null);r[k]=q?q.pay:""});return r}
function pmBox(os,b){const pm=pmInit(os,b),cks=billCks(os);
  return `<div class="pmbox"><b>${esc(t("payHow"))}</b>${cks.map(k=>`<div class="pmrow">${k?`<span class="pmn">${esc(t("check"))}: ${esc(k)} · ${vnd(os.filter(o=>(o.check||t("ckCommon"))===k).reduce((s,o)=>s+tot(o),0))}</span>`:""}${PAYS.map(p=>`<button type="button" class="pmb ${pm[k]===p?"on":""}" data-pm="${p}" data-ck="${esc(k)}" aria-pressed="${pm[k]===p}">${PMI[p]}<span>${esc(t("pay_"+p))}</span></button>`).join("")}</div>`).join("")}</div>`}

/* editor sheet */
function openTipQr(){const me=staffBy(ST.me);if(!me)return;
  $("sheetIn").innerHTML=`<div class="row"><h2>${esc(t("tipQrT"))} · ${esc(me.name)}</h2><span class="sp"></span><button class="btn ghost sm" type="button" id="tqX">${esc(t("cancel"))}</button></div>
   <div class="payqr">${me.tipQr?`<img class="qrimg" src="${me.tipQr}" alt="QR">`:`<div class="qrnone">${esc(t("payQrNo"))}</div>`}<div class="qrt"><p class="muted" style="margin:0">${esc(t("tipQrH"))}</p><div class="row"><label class="btn sm upl">${esc(me.tipQr?t("repQr"):t("upQr"))}<input type="file" accept="image/*" id="tqIn"></label>${me.tipQr?`<button class="btn ghost sm" type="button" id="tqDel">${esc(t("delQr"))}</button>`:""}</div></div></div>`;
  $("sheet").hidden=false;$("tqX").onclick=closeEditor;
  $("tqIn").onchange=e=>readQr(e.target.files[0],d=>{mutate(()=>{const x=staffBy(me.id);if(x)x.tipQr=d});toast(t("qrOk"),"","g");openTipQr()});
  {const d=$("tqDel");if(d)d.onclick=()=>{mutate(()=>{const x=staffBy(me.id);if(x)x.tipQr=""});openTipQr()}}}
let ED=null;
function openEditor(id,parent){
  if(id){const o=ST.orders.find(x=>x.id===id);ED={id,table:o.table,items:JSON.parse(JSON.stringify(o.items)),comment:o.comment||"",wishes:[...(o.wishes||[])],lang:o.lang}}
  else ED={id:null,table:parent?parent.table:1,items:[],comment:"",wishes:[],lang:parent?parent.lang:"vi",parent:parent?parent.no:null};
  drawEditor();$("sheet").hidden=false}
function drawEditor(){const l=ST.lang;const sum=ED.items.reduce((s,i)=>s+M[i.mid].p*i.qty,0);
  $("sheetIn").innerHTML=`<div class="row"><h2>${ED.id?esc(t("editT"))+" "+ED.table:ED.parent?esc(t("addMore"))+" · "+esc(t("table"))+" "+ED.table:esc(t("manualT"))}</h2><span class="sp"></span><button class="btn ghost sm" type="button" id="edX">${esc(t("cancel"))}</button></div>
   ${ED.id?"":`<div class="row"><label for="edTable" class="muted">${esc(t("pickTable"))}</label><input id="edTable" type="number" min="1" max="99" value="${ED.table}" style="width:90px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px"></div>`}
   <div class="ed">${ED.items.length?ED.items.map((i,k)=>`<div class="edl"><span class="nm">${esc(nm(i.mid,"vi"))}${ST.lang==="ru"?` <span class="dim">· ${esc(nm(i.mid,"ru"))}</span>`:""}</span><div class="qa"><button type="button" data-q="-" data-k="${k}" aria-label="−">−</button><b>${i.qty}</b><button type="button" data-q="+" data-k="${k}" aria-label="+">+</button></div><input type="text" data-note="${k}" value="${esc(i.note)}" placeholder="${esc(t("notePh"))}" aria-label="${esc(t("notePh"))}"></div>`).join(""):`<div class="empty">${esc(t("none"))}</div>`}</div>
   <details id="edPick" ${ED.open||!ED.items.length?"open":""}><summary class="muted" style="cursor:pointer;font-weight:600;padding:4px 0">+ ${esc(t("addItem"))}</summary><div class="picker" style="margin-top:8px">${MENU.map(m=>`<button type="button" data-add="${m.id}">${m.ph?`<img src="${PH[m.ph]}" alt="">`:""}<span>${esc(m.vi)}<br><span class="dim">${short(m.p)}</span></span></button>`).join("")}</div></details>
   <div><div class="muted" style="font-weight:600;margin-bottom:6px">${esc(t("wishes"))}</div><div class="wchips">${WISH.map(w=>`<button type="button" data-w="${w.k}" aria-pressed="${ED.wishes.includes(w.k)}">${esc(w[l])}</button>`).join("")}</div></div>
   <div><label for="edCm" class="muted" style="font-weight:600;display:block;margin-bottom:6px">${esc(t("comment"))}</label><textarea id="edCm" class="ta" placeholder="${esc(t("commentPh"))}">${esc(ED.comment)}</textarea></div>
   <div class="row"><b>${esc(t("total"))}: ${vnd(sum)}</b><span class="sp"></span><button class="btn ghost" type="button" id="edSave" ${ED.items.length?"":"disabled"}>${esc(t("save"))}</button><button class="btn" type="button" id="edSend" ${ED.items.length?"":"disabled"}>${esc(t("saveSend"))}</button></div>`;
  const S2=$("sheetIn");
  S2.querySelector("#edX").onclick=closeEditor;
  S2.querySelector("#edPick").ontoggle=e=>{ED.open=e.target.open};
  S2.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{syncED();const it=ED.items[+b.dataset.k];it.qty+=b.dataset.q==="+"?1:-1;if(it.qty<=0)ED.items.splice(+b.dataset.k,1);drawEditor()});
  S2.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{syncED();const ex=ED.items.find(i=>i.mid===b.dataset.add&&!i.note);if(ex)ex.qty++;else ED.items.push({mid:b.dataset.add,qty:1,note:"",done:false,added:!!ED.id});drawEditor()});
  S2.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{syncED();const k=b.dataset.w;ED.wishes=ED.wishes.includes(k)?ED.wishes.filter(x=>x!==k):[...ED.wishes,k];drawEditor()});
  S2.querySelector("#edSave").onclick=()=>commitED(false);
  S2.querySelector("#edSend").onclick=()=>commitED(true);
}
function syncED(){const S2=$("sheetIn");S2.querySelectorAll("[data-note]").forEach(i=>{const it=ED.items[+i.dataset.note];if(it)it.note=i.value.trim()});const c=S2.querySelector("#edCm");if(c)ED.comment=c.value.trim();const tb=S2.querySelector("#edTable");if(tb)ED.table=Math.max(1,+tb.value||1)}
function commitED(send){syncED();if(!ED.items.length)return;
  mutate(()=>{let o;
    if(ED.id){o=ST.orders.find(x=>x.id===ED.id);o.items=ED.items;o.comment=ED.comment;o.wishes=ED.wishes}
    else{o=newOrder({table:ED.table,lang:ED.lang,items:ED.items,comment:ED.comment,wishes:ED.wishes,src:"waiter",status:"accepted"});o.waiter=ST.me;o.acceptedAt=Date.now();o.lateAccept=false}
    if(send&&o.status==="accepted"){o.status="cooking";o.sentAt=Date.now()}});
  ST.wtab="mine";save();closeEditor();render()}
function closeEditor(){$("sheet").hidden=true;ED=null}
$("sheet").addEventListener("click",e=>{if(e.target===$("sheet"))closeEditor()});

/* --- kitchen --- */
function rKitchen(el){const f=ST.ktab;const L=live();
  const filt=o=>f==="all"||o.items.some(i=>M[i.mid].st===(f==="bar"?"b":"k"));
  const cooking=L.filter(o=>o.status==="cooking"&&filt(o)).sort((a,b)=>a.sentAt-b.sentAt);
  const ready=L.filter(o=>o.status==="ready"&&filt(o));
  const card=o=>{const its=o.items.map((i,k)=>[i,k]).filter(([i])=>f==="all"||M[i.mid].st===(f==="bar"?"b":"k"));
    return `<article style="--tc:var(--t${(((+o.table||1)-1)%8+8)%8+1})" class="kc ${o.status==="ready"?"ready":""}" ${o.status==="cooking"?`data-slow="${o.sentAt}"`:""}>
    <div class="kh"><span class="tb">${esc(t("table"))} ${o.table}</span><span>#${o.no}</span><span class="tm" ${o.status==="cooking"?`data-mmss="${o.sentAt}"`:""}>${o.status==="cooking"?mmss(o.sentAt):"✓"}</span></div>
    <div class="kb">${its.map(([i,k])=>`<button type="button" class="ki ${i.done?"done":""}" data-ki="${o.id}" data-k="${k}" ${o.status!=="cooking"?"disabled":""}><span class="q">${i.qty}×</span><span><b>${esc(nm(i.mid,"vi"))}</b>${f==="all"?`<span class="stn ${M[i.mid].st==="b"?"sb":"sk"}">${esc(M[i.mid].st==="b"?t("bar"):t("kit"))}</span>`:""}${i.added?` <span class="badge-new">+</span>`:""}${i.note?`<span class="note">⚠ ${esc(i.note)}</span>`:""}${ST.lang==="ru"?`<span class="sub">${esc(nm(i.mid,"ru"))}</span>`:""}</span></button>`).join("")}
    ${o.wishes&&o.wishes.length?`<div class="kw">⚠ ${o.wishes.map(k=>{const w=WISH.find(x=>x.k===k);return w?esc(w.vi)+(ST.lang==="ru"?" ("+esc(w.ru)+")":""):""}).join(" · ")}</div>`:""}
    ${o.comment?`<div class="kcm">${esc(o.comment)}</div>`:""}</div>
    <div class="kf"><span class="meta">${esc(wname(o.waiter))}</span><span class="sp"></span>${o.status==="cooking"?`<button class="btn green sm" type="button" data-kr="${o.id}">${esc(t("kDone"))}</button>`:`<span class="meta">${esc(t("kReady"))} · <span data-since="${o.readyAt}">${since(o.readyAt)}</span></span>`}</div></article>`};
  const ns=Object.keys(ST.stop||{}).length;
  const ktabs=`<div class="row"><div class="tabs">${[["all",t("kAll")],["kitchen",t("kKitchen")],["bar",t("kBar")],["stop",t("kStop")]].map(([k,lab])=>`<button type="button" data-kt="${k}" class="${k===f?"on":""}">${esc(lab)}${k==="stop"&&ns?`<span class="stopcnt">${ns}</span>`:""}</button>`).join("")}</div><span class="sp"></span>${f==="stop"?"":`<span class="dim">${esc(t("kTap"))}</span>`}</div>`;
  if(f==="stop"){el.innerHTML=ktabs+`<div id="stopIn"></div>`;el.querySelectorAll("[data-kt]").forEach(b=>b.onclick=()=>{ST.ktab=b.dataset.kt;save();render()});rStop(el.querySelector("#stopIn"));return}
  el.innerHTML=ktabs+`
   ${cooking.length?`<div class="kgrid">${cooking.map(card).join("")}</div>`:`<div class="empty">${esc(t("kNone"))}</div>`}
   ${ready.length?`<h3 class="muted">${esc(t("kReady"))} · ${ready.length}</h3><div class="kgrid">${ready.map(card).join("")}</div>`:""}`;
  el.querySelectorAll("[data-kt]").forEach(b=>b.onclick=()=>{ST.ktab=b.dataset.kt;save();render()});
  el.querySelectorAll("[data-ki]").forEach(b=>b.onclick=()=>kItem(b.dataset.ki,+b.dataset.k));
  el.querySelectorAll("[data-kr]").forEach(b=>b.onclick=()=>kReady(b.dataset.kr));
}

/* --- owner --- */
function rOwnerWrap(el){const pend=ST.staff.filter(x=>x.status==="pending").length;
  el.innerHTML=`<div class="otabs"><button type="button" data-ot="stats" class="${ST.otab!=="staff"&&ST.otab!=="stop"?"on":""}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>${esc(t("oStats"))}</button><button type="button" data-ot="staff" class="${ST.otab==="staff"?"on":""}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.8c1.6.8 2.6 2.5 3 5.2"/></svg>${esc(t("oStaff"))}${pend?` <span class="cnt2">${pend}</span>`:""}</button><button type="button" data-ot="stop" class="${ST.otab==="stop"?"on":""}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>${esc(t("kStop"))}${Object.keys(ST.stop||{}).length?` <span class="cnt2">${Object.keys(ST.stop).length}</span>`:""}</button></div>${ST.payQr?"":`<div class="alert red" style="margin-bottom:12px"><span>${esc(t("payQrMiss"))}</span></div>`}<div id="ownIn" style="display:flex;flex-direction:column;gap:12px"></div>`;

/* stop list: cook (kitchen screen) and manager/owner (owner screen) take a dish off the guest menu */
let stopQ="";
const coName=(d,l)=>l==="ru"?d[1]:d[0];
function setStop(k,on){mutate(()=>{ST.stop=ST.stop||{};if(on)ST.stop[k]={at:Date.now(),by:ST.role};else delete ST.stop[k]});toast(on?t("stopOk"):t("stopRet"),coDish(k),on?"r":"g")}
function coDish(k){const [sid,i]=k.split("|");const s=CO.find(x=>x[0]===sid);const d=s&&s[3][+i];return d?coName(d,ST.lang):k}
function rStop(el){const stop=ST.stop||{};const ks=Object.keys(stop).sort((a,b)=>stop[b].at-stop[a].at);const l=ST.lang;
  const row=(k,d,out)=>`<li class="${out?"out":""}" data-q="${esc((d[0]+" "+d[1]).toLowerCase())}"><div class="n"><b>${esc(coName(d,l))}</b>${l==="ru"?`<span>${esc(d[0])}</span>`:""}</div><button class="btn sm ${out?"":"outb"}" type="button" data-stop="${k}" data-on="${out?0:1}">${esc(out?t("stopBack"):t("stopOut"))}</button></li>`;
  el.innerHTML=`<div class="card"><h3>${esc(t("stopT"))} · ${ks.length}</h3><p class="muted" style="margin:0">${esc(t("stopH"))}</p>${ks.length?`<ul class="stopl">${ks.map(k=>{const [sid,i]=k.split("|");const s=CO.find(x=>x[0]===sid);const d=s&&s[3][+i];return d?row(k,d,true):""}).join("")}</ul>`:`<div class="empty" style="padding:14px">${esc(t("stopNone"))}</div>`}</div>
   <div class="card"><h3>${esc(t("stopAll"))}</h3><input class="stopin" id="stopQ" type="search" placeholder="${esc(t("stopQ"))}" value="${esc(stopQ)}"><ul class="stopl" id="stopAll">${CO.map(s=>`<h4 data-sec="${s[0]}">${esc(l==="ru"?s[2]:s[1])}</h4>`+s[3].map((d,i)=>row(s[0]+"|"+i,d,!!stop[s[0]+"|"+i])).join("")).join("")}</ul></div>`;
  const flt=()=>{const q=stopQ.trim().toLowerCase();const all=el.querySelector("#stopAll");let shown={};
    all.querySelectorAll("li").forEach(li=>{const v=!q||li.dataset.q.includes(q);li.hidden=!v;if(v)shown[li.querySelector("[data-stop]").dataset.stop.split("|")[0]]=1});
    all.querySelectorAll("h4").forEach(h=>h.hidden=!shown[h.dataset.sec])};
  const qi=el.querySelector("#stopQ");qi.oninput=()=>{stopQ=qi.value;flt()};flt();
  el.querySelectorAll("[data-stop]").forEach(b=>b.onclick=()=>setStop(b.dataset.stop,b.dataset.on==="1"))}
const ROLE_OPTS=["waiter","kitchen","manager"];
function roleName(r){return t("r_"+r)}

  const joinUrl=location.href.split("#")[0]+"#join";
  const ago=ts=>{const m=Math.round((Date.now()-ts)/60000);return m<60?m+" "+t("min"):m<1440?Math.round(m/60)+" h":Math.round(m/1440)+" d"};
  el.innerHTML=`<div class="card"><h3>${esc(t("payQrT"))}</h3><div class="payqr">${ST.payQr?`<img class="qrimg" src="${ST.payQr}" alt="QR">`:`<div class="qrnone">${esc(t("payQrNo"))}</div>`}<div class="qrt"><p class="muted" style="margin:0">${esc(t("payQrH"))}</p><div class="row"><label class="btn sm upl">${esc(ST.payQr?t("repQr"):t("upQr"))}<input type="file" accept="image/*" id="payQrIn"></label>${ST.payQr?`<button class="btn ghost sm" type="button" id="payQrDel">${esc(t("delQr"))}</button>`:""}</div></div></div></div>
   <div class="card"><h3>${esc(t("revT"))}</h3><p class="muted" style="margin:0">${esc(t("revH"))}</p><div class="revf"><label>${esc(t("revG"))}<input id="revG" type="url" inputmode="url" placeholder="https://maps.app.goo.gl/…" value="${esc((ST.rev||{}).g||"")}"></label><label>${esc(t("revTa"))}<input id="revTa" type="url" inputmode="url" placeholder="https://www.tripadvisor.com/…" value="${esc((ST.rev||{}).ta||"")}"></label><div class="row"><button class="btn sm" type="button" id="revSave">${esc(t("revSave"))}</button></div></div></div>
   <div class="two">
    <div class="card"><h3>${esc(t("qrTitle"))}</h3><div class="qrbox"><div id="qrJoin" class="qr"></div><div class="qrt"><p class="muted" style="margin:0">${esc(t("qrHint"))}</p><div class="code">${esc(ST.joinCode)}</div><button class="btn ghost sm" type="button" id="reissue">${esc(t("reissue"))}</button></div></div></div>
    <div class="card"><h3>${esc(t("reqs"))} · ${pend.length}</h3>${pend.length?pend.map(x=>`<div class="req"><div class="rq1"><b>${esc(x.name)}</b><span class="dim">${esc(x.phone)} · ${ago(x.createdAt)} ${esc(t("ago"))}</span></div><div class="row"><select data-rrole="${x.id}" aria-label="role">${ROLE_OPTS.map(r=>`<option value="${r}">${esc(roleName(r))}</option>`).join("")}</select><span class="sp"></span><button class="btn ghost sm" type="button" data-rej="${x.id}">${esc(t("rejectB"))}</button><button class="btn sm" type="button" data-ok="${x.id}">${esc(t("approveB"))}</button></div></div>`).join(""):`<div class="empty" style="padding:18px">${esc(t("noReqs"))}</div>`}</div>
   </div>
   <div class="card"><h3>${esc(t("team"))} · ${team.length}</h3><div class="tbl"><table><tr><th>${esc(t("oName"))}</th><th>${esc(t("phone"))}</th><th>${esc(t("role"))}</th><th>${esc(t("status"))}</th><th></th></tr>
    ${team.map(x=>`<tr class="${x.status==="blocked"?"blk":""}"><td><b>${esc(x.name)}</b>${x.role==="waiter"?` <span class="pill ${x.tipQr?"st-ready":"st-served"}" title="${esc(t("tipQr"))}">QR ${x.tipQr?"✓":"—"}</span>`:""}${x.id===ST.device?` <span class="dim">· ${esc(t("thisPhone"))}</span>`:""}</td><td>${esc(x.phone)}</td><td>${x.role==="owner"?esc(t("r_owner")):`<select data-role-s="${x.id}" aria-label="role">${ROLE_OPTS.map(r=>`<option value="${r}" ${x.role===r?"selected":""}>${esc(roleName(r))}</option>`).join("")}</select>`}</td><td>${x.status==="blocked"?`<span class="pill st-late">${esc(t("stBlocked"))}</span>`:ST.shift[x.id]?`<span class="pill st-ready">${esc(t("onShift"))}</span>`:`<span class="pill st-served">${esc(t("stActive"))}</span>`}</td><td class="acts">${x.role==="owner"?"":`<button class="btn ghost sm" type="button" data-blk="${x.id}">${esc(x.status==="blocked"?t("unblockB"):t("blockB"))}</button><button class="btn ghost sm danger" type="button" data-del="${x.id}">${esc(t("deleteB"))}</button>`}</td></tr>`).join("")}</table></div></div>

  el.querySelector("#payQrIn").onchange=e=>readQr(e.target.files[0],d=>{mutate(()=>{ST.payQr=d});toast(t("qrOk"),"","g")});
  {const d=el.querySelector("#payQrDel");if(d)d.onclick=()=>{if(!d.dataset.arm){d.dataset.arm="1";d.textContent=t("deleteSure");return}mutate(()=>{ST.payQr=""})}}
  el.querySelectorAll("[data-ok]").forEach(b=>b.onclick=()=>approve(b.dataset.ok,el.querySelector(`[data-rrole="${b.dataset.ok}"]`).value));

  el.querySelectorAll("[data-role-s]").forEach(sl=>sl.onchange=()=>setRole(sl.dataset.roleS,sl.value));
}

/* ---------- owner analytics over a chosen period ----------
   Today (and any day with real orders) comes from the orders in this browser.
   Earlier days in the demo are a deterministic sample history, so periods and comparisons have something to show.
   With the server this becomes one query per period over the saved orders. Days are counted in Vietnam time (UTC+7). */
const DAY=86400e3,HIST_DAYS=180;
const dkey=ts=>new Date(ts+7*3600e3).toISOString().slice(0,10);
const kts=k=>Date.parse(k+"T00:00:00Z")-7*3600e3;
const addD=(k,n)=>dkey(kts(k)+n*DAY+3600e3);
function agg0(){return {rev:0,bills:0,orders:0,acc:[0,0],cook:[0,0],w:{},items:{},lang:{},hrs:{},pay:{cash:0,card:0,qr:0,none:0}}}
function aggAdd(A,B){A.rev+=B.rev;A.bills+=B.bills;A.orders+=B.orders;A.acc[0]+=B.acc[0];A.acc[1]+=B.acc[1];A.cook[0]+=B.cook[0];A.cook[1]+=B.cook[1];
  for(const [id,x] of Object.entries(B.w)){const y=A.w[id]=A.w[id]||{n:0,r:0,acc:[0,0],late:0};y.n+=x.n;y.r+=x.r;y.acc[0]+=x.acc[0];y.acc[1]+=x.acc[1];y.late+=x.late}
  for(const k of ["items","lang","hrs","pay"])for(const [i,v] of Object.entries(B[k]))A[k][i]=(A[k][i]||0)+v;return A}
function aggOrder(A,o,r,accS,cookM,late,h){A.orders++;A.rev+=r;if(accS!=null){A.acc[0]+=accS;A.acc[1]++}if(cookM!=null){A.cook[0]+=cookM;A.cook[1]++}
  if(o.waiter){const y=A.w[o.waiter]=A.w[o.waiter]||{n:0,r:0,acc:[0,0],late:0};y.n++;y.r+=r;if(accS!=null){y.acc[0]+=accS;y.acc[1]++}if(late)y.late++}
  o.items.forEach(i=>{A.items[i.mid]=(A.items[i.mid]||0)+i.qty});A.lang[o.lang]=(A.lang[o.lang]||0)+1;A.hrs[h]=(A.hrs[h]||0)+r}
/* real orders of one day (served), bills counted by the day they were closed */
function realDay(k){const A=agg0();
  ST.orders.filter(o=>o.status==="served"&&dkey(o.createdAt)===k).forEach(o=>{const r=tot(o);
    aggOrder(A,o,r,o.acceptedAt&&o.src==="qr"?(o.acceptedAt-o.createdAt)/1000:null,o.readyAt&&o.sentAt?(o.readyAt-o.sentAt)/60000:null,o.lateAccept||o.escalated,new Date(o.createdAt+7*3600e3).getUTCHours())});
  Object.values(ST.bills).filter(b=>b.closed&&b.closedAt&&dkey(b.closedAt)===k).forEach(b=>{A.bills++;const os=billOrders(b.id);
    if(b.pays&&Object.keys(b.pays).length>1)os.forEach(o=>{const c=o.check||t("ckCommon");A.pay[b.pays[c]||"none"]+=tot(o)});else A.pay[b.pay&&b.pay!=="mix"?b.pay:"none"]+=os.reduce((s,o)=>s+tot(o),0)});
  return A}
/* sample history for days before today: same seed for the same date, so numbers stay put between visits */
const GEN=new Map();const HW=[3,6,7,5,4,6,8,7,4,3,3,4,6,8,7,5];
function genDay(k){if(GEN.has(k))return GEN.get(k);let r=0;for(const c of k)r=(r*31+c.charCodeAt(0))%2147483647;r=r||7;
  const rnd=()=>{r=(r*16807)%2147483647;return r/2147483647};const pick=a=>a[Math.floor(rnd()*a.length)];
  const dow=new Date(kts(k)+7*3600e3).getUTCDay(),ago=(kts(dkey(Date.now()))-kts(k))/DAY;
  const n=Math.round((38+rnd()*16)*([1.3,.9,.85,.9,1,1.2,1.35][dow])*(1-ago*.0015));const A=agg0();const hw=HW.reduce((x,y)=>x+y,0);
  const ws=["minh","minh","lan","lan","lan","huy"],ls=["en","en","ru","ru","ru","ko","zh","vi","en"];
  for(let i=0;i<n;i++){const items=[];for(let j=0,m=1+Math.floor(rnd()*3);j<m;j++)items.push({mid:pick(MENU).id,qty:1+(rnd()<.2?1:0)});
    const o={waiter:pick(ws),lang:pick(ls),items};const rv=items.reduce((s,x)=>s+M[x.mid].p*x.qty,0);
    let q=rnd()*hw,h=7;for(;h<22&&q>HW[h-7];h++)q-=HW[h-7];const acc=10+rnd()*42;
    aggOrder(A,o,rv,rnd()<.8?acc:null,5+rnd()*16,acc>45||rnd()<.03,h);
    if(rnd()>.28){A.bills++;const p=rnd();A.pay[p<.4?"cash":p<.78?"qr":"card"]+=rv}else{A.pay[pick(["cash","qr","qr","card"])]+=rv}}
  GEN.set(k,A);return A}
function dayAgg(k){const today=dkey(Date.now());const A=realDay(k);
  /* a day that already holds the demo seed orders is not topped up with sample history */
  const seeded=ST.orders.some(o=>o.seed&&dkey(o.createdAt)===k);return k<today&&!seeded&&k>=addD(today,-HIST_DAYS)?aggAdd(A,genDay(k)):A}
function periodKeys(){const today=dkey(Date.now()),P=ST.oper||{k:"today"};
  if(P.k==="yest")return [addD(today,-1),addD(today,-1)];
  if(["7","30","90"].includes(P.k))return [addD(today,-(+P.k-1)),today];
  if(P.k==="custom"&&P.from&&P.to){let f=P.from<P.to?P.from:P.to,to=P.from<P.to?P.to:P.from;const min=addD(today,-HIST_DAYS);if(f<min)f=min;if(to>today)to=today;return [f,to]}
  return [today,today]}
function keysIn(f,to){const r=[];for(let k=f;k<=to;k=addD(k,1))r.push(k);return r}
function fmtK(k,o){return new Date(kts(k)+7*3600e3).toLocaleDateString(ST.lang==="ru"?"ru-RU":"vi-VN",Object.assign({timeZone:"UTC"},o||{day:"numeric",month:"short"}))}
function delta(cur,prev,lowerBetter){if(!prev||!cur)return "";const d=(cur-prev)/prev*100;if(Math.abs(d)<.5)return `<em class="dl0">≈ ${esc(t("vsPrev"))}</em>`;
  const good=lowerBetter?d<0:d>0;return `<em class="${good?"dlu":"dld"}">${d>0?"▲":"▼"} ${Math.abs(d).toFixed(0)}% ${esc(t("vsPrev"))}</em>`}
function rOwner(el){const [f,to]=periodKeys();const days=keysIn(f,to);const len=days.length;const pdays=keysIn(addD(f,-len),addD(f,-1));
  const perDay=days.map(k=>[k,dayAgg(k)]);const A=perDay.reduce((x,[,d])=>aggAdd(x,d),agg0());const B=pdays.reduce((x,k)=>aggAdd(x,dayAgg(k)),agg0());
  const today=dkey(Date.now()),isToday=len===1&&f===today;
  const mean=a=>a[1]?a[0]/a[1]:0;const avg=A.bills?A.rev/A.bills:0,pavg=B.bills?B.rev/B.bills:0;
  const openB=Object.values(ST.bills).filter(b=>!b.closed).length;
  const per=ST.staff.filter(s=>s.role==="waiter"&&s.status!=="deleted"&&s.status!=="pending"&&s.status!=="rejected").map(w=>{const x=A.w[w.id]||{n:0,r:0,acc:[0,0],late:0};
    return {w,n:x.n,r:x.r,avg:x.n?x.r/x.n:0,acc:mean(x.acc),late:x.late}}).sort((a,b)=>b.r-a.r);
  const top=Object.entries(A.items).sort((a,b)=>b[1]-a[1]).slice(0,6);const topMax=top.length?top[0][1]:1;
  const lgs=Object.entries(A.lang).sort((a,b)=>b[1]-a[1]);const lgMax=lgs.length?lgs[0][1]:1;
  const hrs={};for(let h=7;h<=22;h++)hrs[h]=A.hrs[h]||0;const hMax=Math.max(1,...Object.values(hrs));
  const pmS=A.pay;const pmT=Object.values(pmS).reduce((a,b)=>a+b,0)||1,pmMax=Math.max(1,...Object.values(pmS));
  const dMax=Math.max(1,...perDay.map(([,d])=>d.rev));const step=len>45?10:len>14?5:1;
  const P=ST.oper||{k:"today"};const PK=[["today",t("pToday")],["yest",t("pYest")],["7",t("p7")],["30",t("p30")],["90",t("p90")],["custom",t("pCustom")]];
  const title=isToday?t("pToday"):len===1?fmtK(f,{day:"numeric",month:"long",weekday:"long"}):fmtK(f)+" – "+fmtK(to);
  const nopt=[["taker",t("nTaker"),t("nTakerD")],["all",t("nAll"),t("nAllD")],["esc",t("nEsc"),t("nEscD")]];
  el.innerHTML=`<div class="pbar"><div class="tabs" id="perTabs">${PK.map(([k,l])=>`<button type="button" data-per="${k}" class="${P.k===k?"on":""}">${esc(l)}</button>`).join("")}</div>
    ${P.k==="custom"?`<div class="pcust"><label>${esc(t("pFrom"))} <input type="date" id="pF" min="${addD(today,-HIST_DAYS)}" max="${today}" value="${P.from||addD(today,-13)}"></label><label>${esc(t("pTo"))} <input type="date" id="pT" min="${addD(today,-HIST_DAYS)}" max="${today}" value="${P.to||today}"></label></div>`:""}</div>
   <div class="row"><h2>${esc(title)}</h2><span class="sp"></span><button class="btn ghost sm" type="button" id="csvBtn">${esc(t("csv"))}</button></div>
   <p class="seed" style="margin:0;align-self:flex-start">${esc(t("histNote"))}</p>
   ${isToday&&!A.orders?`<div class="alert"><span>${esc(t("noToday").replace("{h}",new Date(Date.now()+7*3600e3).toISOString().slice(11,16)))}</span><span class="sp"></span><button class="btn sm" type="button" data-per="yest">${esc(t("pYest"))}</button></div>`:""}
   <div class="kpis">
    <div class="kpi"><small>${esc(t("oRev"))}</small><b>${short(A.rev)} ₫</b><span>${vnd(A.rev)}</span>${delta(A.rev,B.rev)}</div>
    <div class="kpi"><small>${esc(t("oBills"))}</small><b>${A.bills}</b><span>${isToday?esc(t("oOpen"))+": "+openB+" · ":""}${esc(t("oOrders"))}: ${A.orders}</span>${delta(A.bills,B.bills)}</div>
    <div class="kpi"><small>${esc(t("oAvg"))}</small><b>${short(avg)} ₫</b><span>&nbsp;</span>${delta(avg,pavg)}</div>
    <div class="kpi"><small>${esc(t("oAccept"))}</small><b>${Math.round(mean(A.acc))} ${esc(t("sec"))}</b><span>QR → ${esc(t("sAccepted"))}</span>${delta(mean(A.acc),mean(B.acc),true)}</div>
    <div class="kpi"><small>${esc(t("oCook"))}</small><b>${mean(A.cook).toFixed(1)} ${esc(t("min"))}</b><span>${esc(t("sCooking"))} → ${esc(t("sReady"))}</span>${delta(mean(A.cook),mean(B.cook),true)}</div>
   </div>
   ${len>1?`<div class="card"><h3>${esc(t("oByDay"))}</h3><div class="hours days${len>31?" dense":""}">${perDay.map(([k,d],i)=>`<div title="${esc(fmtK(k,{day:"numeric",month:"short",weekday:"short"}))} · ${vnd(d.rev)}"><i style="height:${d.rev/dMax*100}%"></i><small>${(len-1-i)%step===0?new Date(kts(k)+7*3600e3).getUTCDate():"&nbsp;"}</small></div>`).join("")}</div></div>`:""}
   <div class="card"><h3>${esc(t("oWaiters"))}</h3><div class="tbl"><table><tr><th>${esc(t("oName"))}</th>${isToday?`<th>${esc(t("oShift"))}</th>`:""}<th>${esc(t("oOrd"))}</th><th>${esc(t("oRevS"))}</th><th>${esc(t("oAvgS"))}</th><th>${esc(t("oAcc"))}</th><th>${esc(t("oLate"))}</th></tr>
     ${per.map((p,pi)=>`<tr><td><span class="av" style="--c:var(--c${pi%6+1})">${esc(p.w.name[0])}</span><b>${esc(p.w.name)}</b></td>${isToday?`<td>${ST.shift[p.w.id]?'<span class="pill st-ready">●</span>':'<span class="dim">—</span>'}</td>`:""}<td>${p.n}</td><td>${vnd(p.r)}</td><td>${short(p.avg)}</td><td>${p.n?Math.round(p.acc)+" "+esc(t("sec")):"—"}</td><td>${p.late?`<span class="pill st-late">${p.late}</span>`:"0"}</td></tr>`).join("")}</table></div></div>
   <div class="two">
    <div class="card"><h3>${esc(t("oTop"))}</h3><div class="bars">${top.map(([k,v])=>`<div class="bar"><span>${esc(nm(k,ST.lang==="ru"?"ru":"vi"))}</span><i style="width:${Math.max(4,v/topMax*100)}%"></i><span>${v}</span></div>`).join("")}</div></div>
    <div class="card"><h3>${esc(t("oLang"))}</h3><div class="bars">${lgs.map(([k,v])=>`<div class="bar"><span>${esc(LANGNAME[k]||k)}</span><i style="width:${Math.max(4,v/lgMax*100)}%"></i><span>${Math.round(v/(A.orders||1)*100)}%</span></div>`).join("")}</div></div>
   </div>
   <div class="card"><h3>${esc(t("oPay"))}</h3><div class="bars">${[...PAYS,"none"].filter(k=>k!=="none"||pmS.none).map(k=>`<div class="bar"><span>${esc(k==="none"?t("payNone"):t("pay_"+k))}</span><i style="width:${Math.max(4,pmS[k]/pmMax*100)}%"></i><span>${short(pmS[k])} · ${Math.round(pmS[k]/pmT*100)}%</span></div>`).join("")}</div></div>
   <div class="card"><h3>${esc(t("oHours"))}</h3><div class="hours">${Object.entries(hrs).map(([h,v])=>`<div title="${h}:00 · ${vnd(v)}"><i style="height:${v/hMax*100}%"></i><small>${h}</small></div>`).join("")}</div></div>
   <div class="card"><h3>${esc(t("oSettings"))}</h3><div class="radio">${nopt.map(([k,a,b])=>`<label><input type="radio" name="notify" value="${k}" ${ST.notify===k?"checked":""}><span><b>${esc(a)}</b><br><span class="dim">${esc(b)}</span></span></label>`).join("")}</div></div>`;
  el.querySelectorAll("input[name=notify]").forEach(r=>r.onchange=()=>mutate(()=>{ST.notify=r.value}));
  el.querySelectorAll("[data-per]").forEach(b=>b.onclick=()=>{const k=b.dataset.per;ST.oper=Object.assign({},ST.oper||{},{k});if(k==="custom"&&!ST.oper.from){ST.oper.from=addD(today,-13);ST.oper.to=today}save();render()});
  ["pF","pT"].forEach(id=>{const i=el.querySelector("#"+id);if(i)i.onchange=()=>{if(!i.value)return;ST.oper=Object.assign({},ST.oper,id==="pF"?{from:i.value}:{to:i.value});save();render()}});
  el.querySelector("#csvBtn").onclick=()=>{const rows=[[t("csvDate"),t("oRev"),t("oBills"),t("oOrders"),t("oAvg"),t("pay_cash"),t("pay_card"),t("pay_qr")]].concat(perDay.map(([k,d])=>[k,d.rev,d.bills,d.orders,d.bills?Math.round(d.rev/d.bills):0,d.pay.cash,d.pay.card,d.pay.qr]));
    const csv="﻿"+rows.map(r=>r.map(v=>/[;"\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':v).join(";")).join("\r\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download=`chez-oanh_${f}_${to}.csv`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)};
