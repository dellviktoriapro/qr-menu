<title>Sun&amp;Sea Restaurant · Mui Ne · Menu</title>

<style>
/* Layout: "safari lounge at night" — one dark warm world (deliberately single-theme, like the room under the wicker lamps).
   Lion-painting hero → food/drinks switch → photo category cards → chip rail (slides in after the cards) → dish rows → floating order bar → order straight to the staff app, then bill / QR payment */
:root{
  color-scheme:light;
  --bg:#13100c; --bg-2:#1b1611; --card:#211b15; --line:#3a2f24; --ink:#f3ead9; --muted:#b3a58f; --dim:#857862;
  --amber:#e39a3b; --amber-2:#f2b65c; --teal:#3db3ad; --teal-ink:#7fd6d0;
  --f-display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --f-body:"Montserrat",system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:100px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--amber-2);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px}
.eyebrow{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--amber);font-weight:600}
.zebra{height:10px;background:repeating-linear-gradient(105deg,var(--ink) 0 3px,transparent 3px 9px,var(--ink) 9px 11px,transparent 11px 19px);opacity:.10;
  -webkit-mask:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent);mask:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent)}

/* hero */
.hero{position:relative;min-height:520px;display:flex;align-items:flex-end;overflow:hidden;isolation:isolate}
.hero .bg{position:absolute;inset:0;background:center 20%/cover no-repeat;z-index:-2;transform:scale(1.02)}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:
  linear-gradient(180deg,rgba(19,16,12,.35) 0%,rgba(19,16,12,.15) 30%,rgba(19,16,12,.85) 72%,var(--bg) 100%),
  radial-gradient(90% 60% at 80% 20%,rgba(227,154,59,.18),transparent 60%)}
.hero .top{position:absolute;top:0;left:0;right:0;padding-top:14px}
.hero .top .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px}
.open{white-space:nowrap;display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;background:rgba(19,16,12,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(243,234,217,.18);padding:7px 11px;border-radius:999px}
.open i{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 3px rgba(61,179,173,.25)}
.open.closed i{background:#d0533b;box-shadow:0 0 0 3px rgba(208,83,59,.25)}
.langbtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(12px,calc((100vw - 720px)/2 + 12px));z-index:25;display:inline-flex;align-items:center;gap:7px;border:0;background:linear-gradient(180deg,var(--amber-2),var(--amber));color:#1d140a;border-radius:999px;padding:9px 14px 9px 11px;font-size:13.5px;font-weight:800;letter-spacing:.02em;box-shadow:0 6px 20px rgba(0,0,0,.45),0 0 0 3px rgba(19,16,12,.55)}
.langbtn svg{width:17px;height:17px}
.langbtn .cv{width:12px;height:12px;opacity:.8}
/* only while the rail is stuck to the top does the language button sit over its right end */
.rail.stuck .wrap{padding-right:108px}
.rail.stuck .rw .harr.r{right:104px}
.rail.stuck .rw::after{content:"";position:absolute;top:0;bottom:0;right:0;width:100px;background:linear-gradient(90deg,transparent,rgba(19,16,12,.97) 18%);pointer-events:none;z-index:3}
.hero .top .wrap{padding-right:min(46vw,230px)}
.langbtn.compact{padding:8px 11px 8px 10px;top:calc(env(safe-area-inset-top,0px) + 7px)}
.langbtn.compact #langName .ln{display:none}
@media (prefers-reduced-motion:no-preference){.langbtn.hint{animation:lb 1.6s ease-in-out 2}@keyframes lb{50%{transform:scale(1.08)}}}
.hero .txt{padding-block:84px 26px;width:100%}
.hero h1{margin:8px 0 0;font-family:var(--f-display);font-weight:600;font-size:clamp(46px,13vw,76px);line-height:.9;letter-spacing:-.01em;text-wrap:balance}
.hero h1 em{display:block;font-style:italic;font-weight:500;color:var(--amber-2);font-size:.6em;margin-top:6px}
.orn{display:flex;align-items:center;gap:10px;margin:16px 0 12px;color:var(--amber)}
.orn::before,.orn::after{content:"";height:1px;width:56px;background:currentColor;opacity:.6}
.orn svg{width:14px;height:14px}
.hero p{margin:0;max-width:44ch;color:var(--muted);font-size:13.5px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.fact{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(33,27,21,.75);border-radius:12px;padding:8px 11px;font-size:12.5px;color:var(--ink);text-align:left}
.fact svg{width:15px;height:15px;color:var(--amber);flex:none}
.fact.addr{text-decoration:none;flex-basis:100%}
.fact small{display:block;color:var(--dim);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}

/* group switch */
.groups{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border:1px solid var(--line);border-radius:16px;background:var(--bg-2);margin-top:22px}
.groups button{border:0;background:transparent;border-radius:12px;padding:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:12.5px;color:var(--muted)}
.groups button.on{background:var(--amber);color:#1d140a}

.cats{display:flex;gap:10px;overflow-x:auto;padding:16px 16px 4px;scroll-snap-type:x proximity;scrollbar-width:none;max-width:720px;margin:0 auto}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;width:128px;height:150px;scroll-snap-align:start;position:relative;border-radius:16px;overflow:hidden;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--card)}
.cat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cat::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(10,8,6,.92))}
.cat span{position:absolute;left:10px;right:10px;bottom:9px;z-index:1;font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.05}

/* rail */
/* the chip rail repeats the photo cards, so it only slides in from the top once the cards have scrolled away */
.rail{position:fixed;left:0;right:0;top:0;padding-top:env(safe-area-inset-top,0px);z-index:6;background:rgba(19,16,12,.93);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);transform:translateY(-105%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
.rail.stuck{transform:none;visibility:visible;transition:transform .25s ease,visibility 0s}
.cw{margin-bottom:6px}
.rail .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.rail .wrap::-webkit-scrollbar{display:none}
.rail a{flex:none;text-decoration:none;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;white-space:nowrap}
.rail a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.tools{display:flex;gap:8px;align-items:center;padding-block:16px 0}
.search{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg-2);border-radius:12px;padding:11px 12px;font:inherit;color:var(--ink)}
.search::placeholder{color:var(--dim)}
.cur{flex:none;border:1px solid var(--line);background:var(--bg-2);border-radius:12px;padding:11px 8px;font:inherit;color:var(--ink)}
.rate{font-size:11.5px;color:var(--dim);padding-top:7px}

/* sections */
section.s{padding-block:34px 4px;scroll-margin-top:64px}
.sh{position:relative;padding-left:2px}
.sh .vi{display:inline-block;position:relative;font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#1d140a;padding:4px 14px 4px 10px;
  background:var(--amber);clip-path:polygon(2% 12%,98% 0,100% 55%,96% 100%,0 92%,3% 50%)}
section.s h2{margin:10px 0 0;font-family:var(--f-display);font-weight:600;font-size:34px;line-height:1;text-wrap:balance}
.sh .cnt{color:var(--dim);font-size:12px;margin-top:6px}
.note{margin-top:12px;font-size:12.5px;color:var(--muted);border-left:2px solid var(--teal);padding:2px 0 2px 10px}
ul.items{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:2px}
li.it{display:grid;grid-template-columns:1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
li.it.hasph{grid-template-columns:96px 1fr}
li.it.extra{padding:9px 0}
li.it.extra .nm{font-weight:500;font-size:13.5px;color:var(--muted)}
li.it.incart .nm{color:var(--amber-2)}
.it .txt{min-width:0;display:flex;flex-direction:column}
.it .nm{font-weight:600;font-size:15px;line-height:1.3}
.it .orig{font-size:12px;color:var(--teal-ink);margin-top:3px;font-style:italic;font-family:var(--f-display);font-size:14.5px;line-height:1.2}
.ph{width:96px;height:96px;border-radius:14px;overflow:hidden;border:1px solid var(--line);padding:0;background:var(--card);align-self:start;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);margin-left:6px;vertical-align:1px}

.opts{margin-top:auto;padding-top:9px;display:grid;gap:7px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pv{display:flex;flex-direction:column;font-variant-numeric:tabular-nums;min-width:0}
.pv .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:600}
.pv .main{font-weight:700;font-size:15px;color:var(--amber-2)}
.pv .sub{font-size:11.5px;color:var(--dim)}
.pv .ask{font-size:12.5px;color:var(--muted);font-style:italic}
.add{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--amber);background:transparent;color:var(--amber-2);display:grid;place-items:center}
.add:hover{background:var(--amber);color:#1d140a}
.add svg,.step button svg{width:17px;height:17px}
.step{flex:none;display:flex;align-items:center;gap:2px;background:var(--amber);color:#1d140a;border-radius:999px;padding:3px}
.step button{width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.12);color:#1d140a;display:grid;place-items:center}
.step b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.empty{padding:30px 0;color:var(--muted);text-align:center}

/* atmosphere */
.atmo{margin-top:40px}
.atmo h3{font-family:var(--f-display);font-weight:600;font-size:32px;margin:8px 0 0;line-height:1}
.atmo h3 em{color:var(--amber-2);font-weight:500}
.atmo p{color:var(--muted);margin:10px 0 0;max-width:52ch;font-size:13.5px}
.gal{display:grid;grid-template-columns:1.25fr 1fr;grid-template-rows:150px 150px;gap:8px;margin-top:16px}
.gal img{width:100%;height:100%;object-fit:cover;border-radius:14px;display:block;border:1px solid var(--line)}
.gal .a{grid-row:1/3}
.pano{margin-top:8px;height:120px}
.pano img{width:100%;height:100%;object-fit:cover;border-radius:14px;border:1px solid var(--line);display:block}
.quote{margin-top:22px;font-family:var(--f-display);font-style:italic;font-size:19px;line-height:1.35;color:var(--ink);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0}

footer{padding-block:28px 24px;color:var(--muted);font-size:12.5px;line-height:1.6}
footer .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-top:12px}
footer b{color:var(--ink);font-weight:600}
footer .small{color:var(--dim);font-size:11.5px;margin-top:18px}

/* order bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.bar button{pointer-events:auto;max-width:688px;margin:0 auto;width:100%;display:flex;align-items:center;gap:12px;border:0;border-radius:18px;padding:12px 14px;background:var(--amber);color:#1d140a;box-shadow:0 12px 34px rgba(0,0,0,.55);text-align:left}
.bar .q{flex:none;min-width:30px;height:30px;padding:0 8px;border-radius:999px;background:#1d140a;color:var(--amber-2);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.bar .mid{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.bar .mid small{opacity:.75;font-size:11.5px;font-weight:600}
.bar .mid b{font-variant-numeric:tabular-nums;font-size:16px}
.bar .go{flex:none;max-width:45%;text-align:right;font-weight:700;font-size:13px;display:flex;align-items:center;gap:4px}

/* overlays */
.gate{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end;overflow:auto;isolation:isolate;
  padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(26px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.gate .bg{position:absolute;inset:0;background:center 15%/cover no-repeat;z-index:-2}
.gate::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(19,16,12,.2),rgba(19,16,12,.7) 45%,var(--bg) 80%)}
.gate .in{max-width:440px;width:100%;margin:0 auto}
.gate h2{font-family:var(--f-display);font-weight:600;font-size:54px;margin:8px 0 0;line-height:.92}
.gate h2 em{display:block;color:var(--amber-2);font-weight:500;font-size:.6em}
.gate p{margin:12px 0 18px;color:var(--muted);font-size:13px}
.gate .opts2{display:grid;gap:8px}
.gate button{display:flex;justify-content:space-between;align-items:center;background:rgba(33,27,21,.8);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:14px 16px;font-size:16px;font-weight:600;text-align:left}
.gate button span{font-size:12px;font-weight:500;color:var(--dim);font-variant-numeric:tabular-nums}
.gate button.sel{border-color:var(--amber);color:var(--amber-2)}

.lb{position:fixed;inset:0;z-index:50;background:rgba(8,6,4,.92);display:flex;align-items:center;justify-content:center;padding:20px}
.lb figure{margin:0;max-width:520px;width:100%}
.lb img{width:100%;max-height:70vh;object-fit:contain;border-radius:18px;display:block}
.lb figcaption{color:var(--ink);text-align:center;margin-top:12px;font-weight:600}
.lb figcaption small{display:block;color:var(--dim);font-weight:400;font-size:11.5px;margin-top:6px}

.sheet{position:fixed;inset:0;z-index:30;background:rgba(5,4,3,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{width:100%;max-width:720px;max-height:92vh;overflow:auto;background:var(--bg-2);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:30px}
.x{border:1px solid var(--line);background:var(--card);width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.x svg{width:18px;height:18px}
.lines{list-style:none;margin:10px 0 0;padding:0}
.lines li{display:grid;grid-template-columns:1fr auto;gap:10px;padding-block:10px;border-bottom:1px solid var(--line);align-items:center}
.lines .ln{min-width:0}
.lines .ln b{display:block;font-size:14px;font-weight:600}
.lines .ln small{color:var(--dim);font-size:12px}
.wish{margin-top:14px}
.wish .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:12.5px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--teal);color:var(--teal-ink);background:rgba(61,179,173,.12)}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding-top:14px;font-variant-numeric:tabular-nums}
.tot b{font-size:22px;color:var(--amber-2)}
.tot small{display:block;text-align:right;color:var(--dim);font-size:12px}
.row{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;border:0;border-radius:14px;padding:14px;font-weight:700;background:var(--amber);color:#1d140a}
.btn.ghost{flex:none;background:var(--card);border:1px solid var(--line);color:var(--ink);font-weight:600}
.hint{font-size:12px;color:var(--dim);margin-top:10px}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13px}

/* shimmering primary actions */
.bar #barBtn,.btn:not(.ghost),.btn-gold,.pays button{position:relative;overflow:hidden;isolation:isolate}
.bar #barBtn,.btn:not(.ghost),.btn-gold{background:linear-gradient(115deg,#f7c978 0%,#e8a145 42%,#cf7f2a 100%);box-shadow:inset 0 1px 0 rgba(255,236,200,.55),0 0 0 1px rgba(255,200,120,.25),0 10px 28px rgba(227,154,59,.38);animation:glow 3.4s ease-in-out infinite}
.bar #barBtn::after,.btn:not(.ghost)::after,.btn-gold::after,.billb::after,.pays button::after{content:"";position:absolute;top:-30%;bottom:-30%;left:-70%;width:42%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-22deg);animation:sweep 3.4s ease-in-out infinite;pointer-events:none;z-index:-1}
.billb::after,.pays button::after{background:linear-gradient(100deg,transparent,rgba(242,182,92,.28),transparent)}
@keyframes sweep{0%,52%{left:-70%}100%{left:140%}}
@keyframes glow{0%,100%{box-shadow:inset 0 1px 0 rgba(255,236,200,.55),0 0 0 1px rgba(255,200,120,.25),0 10px 28px rgba(227,154,59,.32)}50%{box-shadow:inset 0 1px 0 rgba(255,236,200,.7),0 0 0 1px rgba(255,214,150,.5),0 12px 38px rgba(242,182,92,.6)}}
.bar #barBtn:active,.btn:active,.billb:active,.pays button:active{transform:scale(.97)}
.add{transition:transform .15s,box-shadow .2s,background .2s}
.add:hover,.add:focus-visible{box-shadow:0 0 0 4px rgba(227,154,59,.18),0 0 18px rgba(242,182,92,.45)}
.add:active{transform:scale(.88);background:var(--amber);color:#1d140a}
.barin{max-width:688px;margin:0 auto;display:flex;gap:10px;pointer-events:auto}
.bar .barin button{margin:0}
.bar #barBtn{flex:1}
.bar .billb{flex:none;width:auto;display:flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden;isolation:isolate;color:var(--amber-2);font-weight:700;font-size:13.5px;padding:12px 16px;border:1.5px solid transparent;background:linear-gradient(#1f1912,#1f1912) padding-box,linear-gradient(115deg,#f7c978,#e39a3b,#6b4115,#e39a3b,#f7c978) border-box;background-size:100% 100%,300% 100%;animation:bd 5s linear infinite}
.bills{max-width:688px;margin:0 auto 8px;display:grid;grid-template-columns:1fr 1fr;gap:8px;pointer-events:auto}
.bar .bills button{margin:0;line-height:1.15;font-size:13px;padding:11px 10px;text-align:center}
.bar .bills button svg{flex:none}
body.hasbar{padding-bottom:calc(var(--barh,90px) + 24px)}
body.hasbar .totop{bottom:calc(var(--barh,90px) + 6px + env(safe-area-inset-bottom,0px))}
.cks{max-width:688px;margin:0 auto 8px;display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;pointer-events:auto;padding:6px;border-radius:999px;background:rgba(19,16,12,.94);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.45)}
.cks::-webkit-scrollbar{display:none}
.cks .l{flex:none;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700;padding:0 4px 0 8px}

.rate{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:12px}
.rate .cur{padding:7px 8px;font-size:12.5px;border-radius:10px}
section.s{scroll-margin-top:calc(var(--stickh,130px) + 8px)!important;padding-block:26px 4px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{position:relative;display:flex;flex-direction:column;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#221b14,#1a1510);border:1px solid var(--line);min-width:0}
.tile.big{grid-column:1/-1}
.tile .ph{width:100%!important;height:auto!important;aspect-ratio:1;border:0!important;border-radius:0!important;display:block}
.tile.big .ph{aspect-ratio:16/10}
.tile .ph img{width:100%;height:100%;object-fit:cover;display:block}
.tile .txt{padding:10px 11px 12px;display:flex;flex-direction:column;flex:1;min-width:0}
.tile .nm{font-family:var(--f-display);font-size:17px;font-weight:600;line-height:1.12;color:var(--ink)}
.tile.big .nm{font-size:21px}
.tile .orig{font-size:12px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .opts{padding-top:8px}
.tile .opt{gap:6px;flex-wrap:wrap}
.tile .step{padding:2px}.tile .step button{width:26px;height:26px}.tile .step b{min-width:16px;font-size:13px}
.tile .add{width:32px;height:32px}
.tile .pv .main{font-size:14px}
.tile.incart{border-color:rgba(242,182,92,.55)}
.tile.incart .nm{color:var(--amber-2)}
.tile.out .ph img,.tile.out .nm,.tile.out .orig,.tile.out .pv{opacity:.42;filter:grayscale(.6)}
.tile.out .nm{text-decoration:line-through;text-decoration-thickness:1px}
.tiles+.items{margin-top:8px}
.about{margin-top:34px;padding:22px 18px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,#1f1913,#17130f);scroll-margin-top:calc(var(--stickh,130px) + 8px)}
.about h3{margin:6px 0 8px;font-family:var(--f-display);font-size:30px;font-weight:600}
.about p{margin:0;color:var(--muted);font-size:13.5px;max-width:60ch}
.about .feat{margin-top:18px}
/* capsule */
.bar .cap{pointer-events:auto;max-width:688px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:6px 6px 6px 8px;border-radius:999px;background:rgba(33,27,21,.94);border:1px solid rgba(242,182,92,.35);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 16px 40px rgba(0,0,0,.6)}
.bar .cap button{width:auto;margin:0;box-shadow:none}
.bar .capin{flex:1;min-width:0;display:flex!important;align-items:center;gap:10px;background:none!important;border:0;padding:4px!important;color:var(--ink)!important;text-align:left}
.bar .capin .gs{display:flex;flex:none}
.bar .capin .gs i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--f-display);font-weight:700;font-size:15px;color:#1d140a;border:2px solid #211b15;margin-left:-9px}
.bar .capin .gs i:first-child{margin-left:0}
.bar .capin .gs i.n{background:#1d140a;color:var(--amber-2);border-color:rgba(242,182,92,.5);font-family:var(--f-body);font-size:13px}
.bar .capin .gs i.ic{background:var(--card);color:var(--amber-2);border-color:var(--line)}
.bar .capin .gs i.ic svg{width:16px;height:16px}
.bar .capin .mid small{opacity:1;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .capin .mid b{font-size:15.5px;color:var(--ink)}
.bar #barBtn.go{flex:none!important;border-radius:999px!important;padding:13px 18px!important;font-weight:800;font-size:13.5px;color:#1d140a;justify-content:center}
.bar #barBtn.go[hidden]{display:none!important}
#tbl .gl{display:grid;gap:8px;margin:12px 0 4px}
#tbl .gr{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-align:left;font:inherit;cursor:pointer}
#tbl .gr.on{border-color:var(--amber)}
#tbl .gr i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--f-display);font-weight:700;font-size:16px;color:#1d140a;flex:none}
#tbl .gr span{flex:1;min-width:0;font-weight:700;font-size:14px}
#tbl .gr small{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
#tbl .gr b{font-variant-numeric:tabular-nums;font-size:13.5px}
#tbl .gadd{width:100%;border:1.5px dashed var(--amber);background:rgba(242,182,92,.06);color:var(--amber-2);border-radius:14px;padding:12px;font:800 13.5px var(--f-body)}
#tbl .acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
#tbl .acts button{display:grid;justify-items:center;gap:7px;padding:14px 6px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:12px;line-height:1.2;text-align:center;cursor:pointer}
#tbl .acts button svg{color:var(--amber-2)}
#tbl .acts button.sent{color:var(--muted)}
#tbl .acts button.tip{border-color:rgba(239,154,106,.6);background:linear-gradient(160deg,rgba(239,154,106,.18),rgba(239,154,106,.05))}
#tbl .acts button.tip svg{color:#ef9a6a}
#tbl .hint2{font-size:12.5px;color:var(--muted);margin:10px 0 0}
/* ===== dish sheet, fly-to-cart, live status ===== */
#dish .panel{padding:0 0 calc(18px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
.dhero{position:relative;aspect-ratio:4/3;max-height:52vh;overflow:hidden;background:var(--card)}
.dhero img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;animation:dz 1.2s ease-out}
@keyframes dz{from{transform:scale(1.08)}}
.dhero::after{content:"";position:absolute;inset:auto 0 0 0;height:80px;background:linear-gradient(180deg,transparent,var(--bg-2));pointer-events:none}
.dhero .x{position:absolute;top:12px;right:12px;z-index:2;background:rgba(19,16,12,.7);backdrop-filter:blur(6px)}
.dbd{padding:6px 18px 0;display:grid;gap:6px;position:relative}
#dish .dhero[hidden]+.dbd{padding-top:18px}
#dish h3{font-size:30px;line-height:1.05;text-wrap:balance}
#dish .orig{font-family:var(--f-display);font-style:italic;font-size:16px;color:var(--teal-ink)}
.dnote{font-size:11.5px;color:var(--dim)}
#dOpts .opts{padding-top:10px;gap:10px}
#dOpts .opt{padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
#dOpts .pv .main{font-size:17px}
#dOpts .add{width:44px;height:44px}
#dOpts .step button{width:36px;height:36px}
#dish.out #dOpts{opacity:.5}
.tile,.it[data-d]{cursor:pointer}
.fly{position:fixed;z-index:70;border-radius:14px;object-fit:cover;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.bar .cap.bump .gs{animation:capb .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes capb{40%{transform:scale(1.3)}}
.bar .cap.live .mid small{color:var(--amber-2)}
#tbl .live{display:grid;gap:10px;margin-top:12px}
.lo{border:1px solid rgba(242,182,92,.35);border-radius:16px;background:linear-gradient(180deg,rgba(242,182,92,.08),rgba(242,182,92,.02));padding:12px 14px;display:grid;gap:10px}
.loh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.loh b{font-family:var(--f-display);font-size:20px;font-weight:600}.loh span{font-size:12px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.steps .stp{display:grid;justify-items:center;gap:5px;text-align:center;font-size:10px;font-weight:600;color:var(--dim);position:relative}
.steps .stp i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--bg-2);z-index:1}
.steps .stp::before{content:"";position:absolute;top:6px;left:-50%;right:50%;height:2px;background:var(--line)}
.steps .stp:first-child::before{display:none}
.steps .stp.pass{color:var(--muted)}.steps .stp.pass i{background:var(--amber);border-color:var(--amber)}.steps .stp.pass::before,.steps .stp.now::before{background:var(--amber)}
.steps .stp.now{color:var(--ink)}.steps .stp.now i{border-color:var(--amber-2);box-shadow:0 0 0 5px rgba(242,182,92,.2);animation:lp 1.4s ease-in-out infinite}
@keyframes lp{50%{box-shadow:0 0 0 9px rgba(242,182,92,0)}}
.lo p{margin:0;font-size:13px;color:var(--ink)}
@media (prefers-reduced-motion:reduce){.dhero img,.steps .stp.now i,.bar .cap.bump .gs{animation:none}}
/* ===== item extras: number, tags, description, price note ===== */
.tile .ph{position:relative}
.tgs{position:absolute;left:8px;top:8px;right:8px;display:flex;flex-wrap:wrap;gap:4px;pointer-events:none}
.tgs.in{position:static;margin-bottom:4px}
.tg{font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 8px;background:rgba(19,16,12,.78);color:var(--amber-2);backdrop-filter:blur(4px)}
.tg-special,.tg-best,.tg-must{background:#a3201f;color:#fff3d8}
.tg-signature,.tg-day,.tg-premium{background:var(--amber);color:#1d140a}
.tg-preorder{background:#2c5c3f;color:#eaf6ea}
.num{position:absolute;right:8px;bottom:8px;min-width:30px;height:30px;padding:0 7px;border-radius:999px;display:grid;place-items:center;font-weight:800;font-size:12.5px;background:rgba(19,16,12,.8);color:var(--amber-2);border:1px solid rgba(242,182,92,.5)}
.nr{color:var(--amber-2);font-weight:800}
.ds{font-size:12px;color:var(--muted);line-height:1.4;margin-top:4px}
.tile .ds{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pnote{font-size:11.5px;font-weight:700;color:var(--amber-2);margin-top:4px}
.ddesc{font-size:14px;color:var(--ink);line-height:1.5;opacity:.9}

/* Sun&Sea · coastal menu, approved concept 23 October 2026.
   This layer belongs only to Sun&Sea; the shared ordering engine stays in chez/tpl.html. */
:root{
  --bg:#f6f3eb;--bg-2:#fbfaf6;--card:#fffefa;--line:#dcded2;
  --ink:#243022;--muted:#61675c;--dim:#73796e;
  --amber:#26401c;--amber-2:#35572a;--teal:#a44729;--teal-ink:#87503b;
  --f-display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;background:var(--bg);font-size:14px;line-height:1.5;position:relative;isolation:isolate}
/* Broad, low-contrast palm shadows; never repeat illustrations behind each dish. */
body::before,body::after{content:"";position:absolute;z-index:-1;pointer-events:none;width:230px;height:670px;opacity:.055;background:repeating-conic-gradient(from 18deg at 100% 8%,transparent 0deg 5deg,#26401c 6deg 8deg,transparent 9deg 14deg);border-radius:90% 0 85% 5%;filter:blur(3px);-webkit-mask-image:linear-gradient(145deg,transparent 8%,#000 35%,transparent 74%);mask-image:linear-gradient(145deg,transparent 8%,#000 35%,transparent 74%)}
body::before{right:0;top:470px}
body::after{left:0;top:1700px;transform:scaleX(-1)}
.wrap{max-width:1440px;padding-inline:24px}
.hero{min-height:0;height:360px;align-items:flex-start;overflow:hidden}
.hero .bg{background-size:cover!important;background-position:center 46%!important;transform:none!important}
.hero::before{background:linear-gradient(180deg,rgba(246,243,235,.16),transparent 42%,transparent 68%,var(--bg) 100%)!important}
.hero .txt{position:relative;text-align:center;padding:82px 20px 0!important}
.hero h1.logo{font-size:clamp(68px,7.6vw,108px)!important;line-height:.9;letter-spacing:-.055em;color:#213b21;text-shadow:0 1px 20px rgba(255,255,255,.75);margin:0;font-weight:600}
.logo em{display:block;font-family:var(--f-body);font-size:12px!important;letter-spacing:.3em!important;font-weight:600!important;text-transform:uppercase;font-style:normal!important;margin-top:14px!important;color:var(--amber)!important}
.hero .top{display:none}
.hsub{position:absolute;top:19px;left:0;right:0;z-index:5;max-width:none;padding-inline:28px}
.hmeta{margin:0;justify-content:flex-end;gap:14px}
.tchip{background:rgba(255,254,250,.88);color:var(--amber);padding:9px 14px;font-size:12px;font-weight:700}
.hlink{color:var(--amber);border-bottom-color:rgba(38,64,28,.35);font-weight:600}
.langbtn{position:absolute;top:18px;left:28px;right:auto;z-index:25;background:rgba(255,254,250,.92);color:var(--amber);box-shadow:none;border:1px solid rgba(38,64,28,.1);font-size:12px;padding:10px 13px;border-radius:999px;animation:none!important}
body.stuck .langbtn{opacity:1;pointer-events:auto;transform:none}
.langbtn.compact{top:18px;padding:10px 13px}
.langbtn.compact #langName .ln{display:inline}
.stick{background:rgba(246,243,235,.97);box-shadow:none;border-bottom:1px solid rgba(38,64,28,.12);padding:8px 0 0;top:0;backdrop-filter:blur(12px)}
.stick .wrap{max-width:1440px}
.srow{gap:24px}
.srow .search{background:rgba(255,254,250,.65);border-color:var(--line);border-radius:999px;font-size:12px;padding:10px 16px;max-width:300px}
.srow .groups{order:-1;background:none;border:0;gap:20px;padding:0;flex:1;border-radius:0;justify-content:center}
.srow .groups button{border-radius:0;background:none;color:var(--muted);text-transform:none;letter-spacing:0;padding:10px 4px 12px;font-size:15px;font-weight:600;border-bottom:2px solid transparent}
.srow .groups button.on{background:none;color:var(--teal);border-bottom-color:var(--teal)}
.stick .cw{margin:0}
.cats{padding:12px 0!important;gap:6px!important;align-items:stretch;scroll-padding:16px;max-width:none}
.cat{width:auto!important;max-width:230px;display:flex;align-items:center;justify-content:center;border-radius:999px!important;padding:9px 14px;white-space:nowrap;text-align:left;gap:0;scroll-snap-align:start}
.cat span{display:block!important;font-size:12px!important;line-height:1.4!important;font-weight:500;color:var(--muted);text-align:inherit;white-space:nowrap;overflow:visible}
.cat.on{background:#eadecf!important}.cat.on span{color:#87432b;font-weight:700}
.cat:hover{background:rgba(38,64,28,.06)!important}
.cw .harr{top:12px!important;background:var(--bg-2);border-color:var(--line);color:var(--amber)}
.cw .harr.l{left:-12px}.cw .harr.r{right:-12px}
.rate{padding-top:20px;gap:10px;color:var(--dim);font-size:11px}
.rate .cur{background:transparent;border-color:var(--line);font-size:11px;padding:5px 8px}
main.wrap{padding-bottom:28px}
section.s{padding-block:40px 8px;position:relative}
.sh{display:block;padding:0}
.sh .tt{display:flex;flex-direction:column;align-items:flex-start}
.sh .tt::before{content:"";display:block;width:30px;height:2px;background:var(--teal);margin-bottom:13px}
section.s h2{font-size:clamp(34px,4vw,58px)!important;line-height:1.04;margin:0!important;letter-spacing:-.025em;font-weight:600;max-width:26ch}
.sh .vi{background:none;clip-path:none;color:var(--muted);padding:0;margin-top:9px;letter-spacing:0;text-transform:none;font-family:var(--f-body);font-size:11px;font-weight:400;order:2}
section.s .note{border:0;margin:10px 0 0;padding:0;max-width:75ch;color:var(--muted);font-size:12px;line-height:1.6}
.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:34px 22px;margin-top:26px}
.tile{border:0;background:none;box-shadow:none;border-radius:0;overflow:visible;cursor:pointer}
.tile .ph,.tile.big .ph{aspect-ratio:1.16!important;background:none;border:0;border-radius:0;overflow:visible}
.tile .ph img{object-fit:contain;width:100%;height:100%;transform:none;filter:none}
.tile:hover .ph img{transform:translateY(-3px);transition:transform .2s}
.tile .txt{padding:12px 4px 0;align-items:stretch}
.tile .nm{font-family:var(--f-display);font-size:24px;line-height:1.06;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.tile .orig{font-family:var(--f-body);font-size:10px;line-height:1.45;color:var(--dim);font-style:normal;margin-top:7px}
.tile .ds{font-size:11px;line-height:1.6;margin-top:7px;-webkit-line-clamp:3}
.tile .opts{padding-top:16px;gap:9px}
.tile .opt{flex-wrap:nowrap;align-items:center;justify-content:space-between}
.tile .pv .main{font-family:var(--f-display);font-weight:600;color:var(--ink);font-size:24px;line-height:1.1;white-space:nowrap}
.tile .pv .sub{font-size:10px;margin-top:3px;color:var(--dim)}
.pv .lbl{letter-spacing:0;text-transform:none;color:var(--muted);font-size:10px}
.pv .main{color:var(--ink)}.pv .sub{color:var(--dim)}
.tile .add,.add{background:var(--amber);border-color:var(--amber);color:#fffefa;width:38px;height:38px}
.add:hover{background:#3b5b30;color:white}
.step{background:var(--amber);color:white;gap:0}.step button{color:white;background:transparent}.step b{color:white}
.tile.incart .nm{color:var(--amber)}
.tile.out .ph img{opacity:.35;filter:grayscale(.7)}
.tile .num{display:none}
.tile .tgs{position:static;justify-content:center;margin-top:0;min-height:18px;gap:4px}
.tg{font-family:var(--f-body);font-size:8px;letter-spacing:0;text-transform:none;font-weight:600;background:#e7ecdf;color:var(--amber);backdrop-filter:none;border:0;padding:3px 7px}
.tg-special,.tg-best,.tg-must{background:#eee0d5;color:#8a3a25}
.tg-signature,.tg-premium,.tg-day{background:#e7ecdf;color:var(--amber)}
.tg-preorder{background:#eee8d8;color:#63572d}
.pnote{font-size:11px;color:var(--teal)}
ul.items{display:grid;gap:0 38px;margin-top:26px;grid-template-columns:1fr}
li.it{border-bottom:1px solid rgba(38,64,28,.15);padding-block:18px;break-inside:avoid;cursor:pointer}
li.it .nm{font-family:var(--f-display);font-size:24px;font-weight:600;line-height:1.15}
li.it .orig{font-family:var(--f-body);font-size:10px;color:var(--dim);font-style:normal;line-height:1.5;margin-top:5px}
li.it .opts{padding-top:12px}li.it .ds{font-size:11.5px;line-height:1.6}
li.it .nr{font-family:var(--f-body);font-weight:500;color:var(--dim);font-size:11px;vertical-align:middle;margin-right:4px}
li.it .pv .main{font-size:16px;font-weight:600;color:var(--ink)}
.items .tgs.in{margin-bottom:7px}
.it .lead i{border-color:var(--line)}
#atmo{display:none}
.about{background:rgba(255,254,250,.65);border-color:var(--line);border-radius:18px;padding:28px;margin-top:40px}
.about h3.logo{font-size:44px}.about h3.logo em{font-size:10px!important;letter-spacing:.12em!important}
.about .eyebrow{color:var(--muted)}.about p{line-height:1.7}
.fact{background:var(--bg-2);border-color:var(--line)}.fact small{color:var(--muted)}
.feat .ft{background:transparent;border-color:var(--line)}
.zebra{display:none}
.bar{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar .cap{max-width:560px;background:rgba(255,254,250,.98);border:1px solid var(--line);box-shadow:0 8px 28px rgba(38,64,28,.13)}
.bar .capin .gs i{border-color:var(--card)}
.bar .capin .gs i.n,.bar .capin .gs i.ic{background:var(--amber);color:white;border-color:var(--amber)}
.bar .capin .mid small{color:var(--muted)}.bar .capin .mid b{color:var(--ink);font-weight:700}
.bar #barBtn.go,.btn:not(.ghost),.btn-gold{background:var(--amber);color:#fffefa;box-shadow:none;animation:none}
.bar #barBtn.go{padding:13px 20px!important;font-weight:700;font-size:12px}
.bar #barBtn::after,.btn::after,.billb::after,.pays button::after{display:none}
.bar .bills button,.bar .billb{background:var(--bg-2);color:var(--amber);border-color:var(--line);animation:none}
.sheet{background:rgba(25,38,26,.38)}
.sheet .panel{background:var(--bg-2);border-color:var(--line);box-shadow:0 -10px 60px rgba(20,40,20,.12)}
.sheet h3{font-size:34px}.sheet .hint{color:var(--muted)}
.x{background:var(--card);color:var(--amber);border-color:var(--line)}
.btn.ghost{background:transparent;color:var(--amber);border-color:var(--line)}
.dhero{background:transparent!important;border:0!important;aspect-ratio:auto!important}
.dhero img{object-fit:contain!important;background:transparent;max-height:370px}
.dhero::after{display:none}
.dcard{background:var(--bg-2);border-color:var(--line);box-shadow:0 20px 70px rgba(20,40,20,.2)}
.dcard .ok{background:var(--amber);color:white;box-shadow:none}
.dcard .stars{color:var(--amber)}.dcard small{color:var(--muted)}
.qrsum,.qrbox,.askb,.lo,#tbl .gr{background:var(--card);border-color:var(--line)}
.qrsum b,.qrsum span{color:var(--ink)}
.pays button{background:var(--card);color:var(--amber);border-color:var(--line)}
.asks button,.gadd,.splitb,.cks button,.ckpick button,.chips button{background:var(--card);color:var(--ink);border-color:var(--line)}
.asks button:first-child,.ckpick button.on,.chips button.on,.cks button.on{background:var(--amber);color:white}
.tgrid button{background:var(--card);color:var(--amber);border-color:var(--line)}
.tipb{background:var(--amber);color:white;animation:none;box-shadow:none}
.tipf{background:transparent;border-color:var(--line)}
.lo{background:var(--card)}.steps .stp.now{color:var(--amber)}
.lb{background:rgba(24,34,23,.94)}.lb figcaption{color:#f6f3eb}.lb figcaption small{color:#d0d7ca}
.toast{background:var(--amber);color:white;border-color:var(--amber)}
.totop{background:var(--card);color:var(--amber);border-color:var(--line);box-shadow:0 2px 12px rgba(38,64,28,.1)}
.gate{background:var(--bg)}
.gate .bg{background-size:auto 52%!important;background-position:center top!important;background-repeat:no-repeat!important}
.gate::before{background:linear-gradient(180deg,transparent 8%,rgba(246,243,235,.15) 25%,var(--bg) 50%)!important}
.gate .in{padding-top:160px}.gate .eyebrow{display:none}
.gate h2.logo{color:var(--amber);font-size:62px;font-weight:600;letter-spacing:-.04em}
.gate button{background:var(--card);border-color:var(--line);color:var(--ink);padding:12px 16px}.gate button.sel{border-color:var(--amber);color:var(--amber)}
.gate button span{color:var(--muted)}
@media(min-width:700px){
  .hero{height:400px}.tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:42px 28px}
  ul.items{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(min-width:1100px){
  :root{--side:218px}
  .hero{height:390px}.hero .txt{padding-top:80px!important}
  .stick{position:sticky;float:left;top:0;width:var(--side);margin:22px 0 0 22px;padding:20px 0 16px;border:0;border-right:1px solid var(--line);background:transparent;backdrop-filter:none;z-index:8;max-height:100vh;overflow-y:auto;scrollbar-width:thin}
  .stick .wrap{padding:0 20px 0 0}
  .srow{flex-direction:column;gap:16px;align-items:stretch}
  .srow .groups{order:0;justify-content:flex-start;gap:18px;flex:none}

  .srow .search{order:1;max-width:none;width:100%;font-size:11px;padding:9px 12px}
  .cats{display:flex;flex-direction:column;max-height:calc(100vh - 158px);overflow-y:auto;overflow-x:hidden;padding:10px 0!important;gap:3px!important;align-items:stretch;scroll-snap-type:none;scrollbar-width:thin;cursor:default}
  .cat{max-width:none;width:100%!important;white-space:normal;padding:9px 12px;border-radius:10px!important;justify-content:flex-start}
  .cat span{white-space:normal;font-size:11px!important}
  .cw .harr{display:none}
  main.wrap{margin:0 0 0 calc(var(--side) + 22px);max-width:none;padding-inline:36px}
  .rate{padding-top:24px}
  section.s{scroll-margin-top:20px!important;padding-top:32px}
  section.s h2{font-size:54px!important}
  .tiles{gap:42px 26px}
  .tile .nm{font-size:26px}.tile .pv .main{font-size:27px}
  .about,footer.wrap{margin-left:calc(var(--side) + 58px);margin-right:36px;max-width:none}
  .bar{left:calc(var(--side) + 22px)}
}
@media(min-width:1700px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:699px){
  .wrap{padding-inline:18px}
  .hero{height:280px}.hero .bg{background-size:auto 100%!important;background-position:53% center!important}
  .hero .txt{padding-top:84px!important}.hero h1.logo{font-size:68px!important}.logo em{font-size:10px!important;margin-top:10px!important}
  .langbtn,.langbtn.compact{top:14px;left:16px;padding:8px 11px}.langbtn .ln{display:none!important}
  .hsub{top:14px;padding-inline:16px}.hmeta{gap:0}.hlink{display:none}.tchip{font-size:11px;padding:8px 11px}
  .stick{padding-top:7px}.srow{flex-wrap:wrap;gap:8px}
  .srow .groups{gap:24px;flex:1}.srow .groups button{font-size:14px;padding:8px 2px}
  .srow .search{max-width:49%;padding:9px 12px;font-size:10px}
  .stick .cw{margin-inline:-18px}.cats{padding:9px 18px!important;gap:3px!important}.cat{padding:8px 12px}.cat span{font-size:10px!important}
  .rate{padding-top:15px;font-size:9px}.rate .cur{font-size:10px}
  section.s{padding-top:26px}.sh .tt::before{margin-bottom:10px;width:25px}
  section.s h2{font-size:37px!important;max-width:19ch}.sh .vi{font-size:9px;margin-top:7px}
  section.s .note{font-size:10.5px;line-height:1.6}
  .tiles{gap:26px 14px;margin-top:20px}
  .tile .txt{padding:9px 0 0}.tile .nm{font-size:21px;line-height:1.06}
  .tile .orig{font-size:9px;line-height:1.4;margin-top:5px}
  .tile .ds{font-size:10px;line-height:1.5;-webkit-line-clamp:3}
  .tile .opts{padding-top:12px}.tile .pv .main{font-size:22px}.tile .pv .sub{font-size:9px}
  .tile .add{width:32px;height:32px}.tile .step button{width:23px;height:28px}.tile .step b{min-width:15px}
  .tile .tgs{gap:2px}.tile .tg{font-size:7px;padding:2px 5px}
  .tile .pnote{font-size:9px}.tile .pv .lbl{font-size:9px}
  li.it .nm{font-size:23px}li.it .orig{font-size:9px}
  .about{padding:22px 18px;border-radius:14px}.about p{font-size:12px}
  .bar .cap{gap:6px}.bar #barBtn.go{padding:12px 15px!important;font-size:11px}
  .bar .capin{gap:7px}.bar .capin .mid b{font-size:13px}.bar .capin .mid small{font-size:9px}
  .bar .capin .gs i{width:27px;height:27px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}.tile:hover .ph img{transform:none}}

/* Match the approved desktop/mobile composition rather than the earlier draft. */
.hero{height:310px}.hero .txt{padding-top:68px!important}
.hero h1.logo{font-size:clamp(65px,7vw,92px)!important;letter-spacing:-.045em}
.hero::before{background:linear-gradient(180deg,rgba(246,243,235,.06),transparent 40%,transparent 66%,var(--bg) 100%)!important}
.coastnav{display:none}
.coast-icon{width:22px;height:22px;flex:none}
.tile .ph{aspect-ratio:1.12!important}.tile .tgs{display:none}
.tile .txt{padding-top:4px}.tile .orig{display:none}

function observeMenuPhotos(){
 document.querySelectorAll('#menu section.s').forEach((section,i)=>{
  const art=document.createElement('span');
  art.className='coast-scenery'+(i%2?' botanical':'');
  art.setAttribute('aria-hidden','true');
  art.style.backgroundPosition=`right -${(i%4)*180}px`;
  section.appendChild(art);
 });
 for(const id of ['ss_pies','ss_pizza']){const section=document.getElementById(id),note=section?.querySelector('.note');if(note)section.querySelector('.sh').appendChild(note);}

 if(menuPhotoObserver)menuPhotoObserver.disconnect();
 const images=document.querySelectorAll('#menu img[data-menu-src]');
 const load=img=>{img.src=img.dataset.menuSrc;delete img.dataset.menuSrc;};
 if(!('IntersectionObserver' in window)){images.forEach(load);return;}
 menuPhotoObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{
  if(entry.isIntersecting){load(entry.target);menuPhotoObserver.unobserve(entry.target);}
 }),{rootMargin:'220px 0px'});
 images.forEach(img=>menuPhotoObserver.observe(img));
}

function flyToCart(img){try{if(!img||matchMedia("(prefers-reduced-motion: reduce)").matches)return;const a=img.r;if(!a||!a.width)return;
  const tgt=$("capG").getBoundingClientRect();const f=document.createElement("img");f.src=img.src;f.alt="";f.className="fly";const w=Math.min(110,a.width),h=w*(a.height/a.width||1);
  Object.assign(f.style,{left:(a.left+a.width/2-w/2)+"px",top:(a.top+a.height/2-h/2)+"px",width:w+"px",height:h+"px"});document.body.appendChild(f);
  const dx=tgt.left+tgt.width/2-(a.left+a.width/2),dy=tgt.top+tgt.height/2-(a.top+a.height/2);
  const an=f.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:`translate(${dx}px,${dy}px) scale(.16)`,opacity:.6}],{duration:650,easing:"cubic-bezier(.5,-.25,.6,1)",fill:"forwards"});
  const done=()=>{f.remove();const c=$("cap");c.classList.remove("bump");void c.offsetWidth;c.classList.add("bump")};an.onfinish=done;setTimeout(()=>{if(f.isConnected)done()},800);
  try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}}catch(e){}}

function hscroll(r,wrap){let down=false,sx=0,sl=0,moved=false;
  const [L,R]=wrap.querySelectorAll(".harr");
  const sync=()=>{L.disabled=r.scrollLeft<6;R.disabled=r.scrollLeft+r.clientWidth>=r.scrollWidth-6};
  r.addEventListener("scroll",()=>requestAnimationFrame(sync),{passive:true});
  new MutationObserver(()=>requestAnimationFrame(sync)).observe(r,{childList:true});window.addEventListener("resize",sync);
  L.addEventListener("click",()=>r.scrollBy({left:-r.clientWidth*.75,behavior:"smooth"}));
  R.addEventListener("click",()=>r.scrollBy({left:r.clientWidth*.75,behavior:"smooth"}));
  r.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse")return;down=true;moved=false;sx=e.clientX;sl=r.scrollLeft});
  window.addEventListener("pointermove",e=>{if(!down)return;const dx=e.clientX-sx;if(Math.abs(dx)>5){moved=true;r.classList.add("hdrag")}r.scrollLeft=sl-dx});
  window.addEventListener("pointerup",()=>{if(!down)return;down=false;setTimeout(()=>r.classList.remove("hdrag"),0)});
  r.addEventListener("click",e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false}},true);
  /* a mouse wheel over the row scrolls it sideways; at either end the page scrolls on as usual */
  r.addEventListener("wheel",e=>{if(Math.abs(e.deltaY)<=Math.abs(e.deltaX))return;const max=r.scrollWidth-r.clientWidth;if(max<2)return;const nx=Math.max(0,Math.min(max,r.scrollLeft+e.deltaY));if(Math.abs(nx-r.scrollLeft)<1)return;r.scrollLeft=nx;e.preventDefault()},{passive:false});
  sync()}

let io;
function spy(){if(io)io.disconnect();if(!("IntersectionObserver" in window))return;
  io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){const id=en.target.id;
    document.querySelectorAll("#cats .cat").forEach(a=>{const on=a.dataset.id===id;a.classList.toggle("on",on);
      if(on){const r=a.parentElement;r.scrollTo({left:a.offsetLeft-r.clientWidth/2+a.clientWidth/2,top:a.offsetTop-r.clientHeight/2+a.clientHeight/2,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"instant":"smooth"})}})}})},{rootMargin:"-160px 0px -60% 0px"});
  document.querySelectorAll("section.s").forEach(s=>io.observe(s))}
